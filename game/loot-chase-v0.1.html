  // Returns Kiran to whatever tint the current state calls for (Tejas glows gold).
  restorePlayerTint() {
    if (!this.playerSprite) return;
    if (this.tejasActive > 0) this.playerSprite.setTint(0xffe08a);
    else this.playerSprite.clearTint();
  }

  // A claw-arc between attacker and target: shows WHO hit you and from WHERE.
  slashFx(src, dst) {
    const a = Math.atan2(dst.y - src.y, dst.x - src.x);
    const g = this.add.graphics({ x: (src.x + dst.x) / 2, y: (src.y + dst.y) / 2 }).setDepth(30);
    const perp = a + Math.PI / 2;
    g.lineStyle(3.2, 0xfff0d8, 0.95);
    g.beginPath(); g.arc(0, 0, 13, perp - 1.05, perp + 1.05); g.strokePath();
    g.lineStyle(1.8, 0xff5a3a, 0.9);
    g.beginPath(); g.arc(0, 0, 18, perp - 0.85, perp + 0.85); g.strokePath();
    this.tweens.add({ targets: g, alpha: 0, scale: 1.35, duration: 210, onComplete: () => g.destroy() });
  }

  // The attacker visibly lunges at you. Stored as an offset rather than tweened, because
  // the update loop re-positions every sprite from its logical position each frame.
  enemyLunge(e) {
    const d = Math.hypot(this.player.x - e.x, this.player.y - e.y) || 1;
    e.lunge = { t: 0, dur: 200, dx: (this.player.x - e.x) / d, dy: (this.player.y - e.y) / d,
                amp: Math.min(16, 6 + e.radius * 0.5) };
  }

  // ---------- BOSS COMBAT ----------
  // Before this, a shielded boss was completely inert (it only repositioned its shield),
  // slams did a flat 22-28 that never scaled, and contact damage was 0 - so standing
  // next to a boss was safe indefinitely. Every boss now: hits on contact, summons
  // Asura, and cycles through a telegraphed slam kit that scales with depth AND with
  // the player's own max HP, so stacking Vitality cannot trivialise it.
  armBoss(e, kind) {
    const byKind = {
      gatekeeper: { types: this.sector >= 2 ? ['circle', 'line'] : ['circle'], cooldown: 2400, radius: 78, summonEvery: 9000 },
      sectorboss: { types: ['circle', 'line'],            cooldown: 2300, radius: 90, summonEvery: 8000 },
      megaboss:   { types: ['circle', 'line', 'scatter'], cooldown: 1900, radius: 96, summonEvery: 7000 }
    }[kind];
    e.slamTypes = byKind.types;
    e.slamCooldown = byKind.cooldown;
    e.slamRadius = byKind.radius;
    e.slamTimer = 1400;                    // a short grace beat after it appears
    e.slam = null;
    e.summonEvery = byKind.summonEvery;
    e.summonTimer = byKind.summonEvery;
    e.contactDmg = (10 + this.depth * 1.6) * sectorDmgMult(this.sector);
  }

  updateBoss(e, edx, edy, edist, dt, delta) {
    // Rooted while shielded (the anchor puzzle is a stand-off) and while winding up a
    // slam (so the telegraph stays honest), but never idle.
    if (!e.shieldOn && !e.slam) {
      e.x += (edx/edist) * e.speed * dt;
      e.y += (edy/edist) * e.speed * dt;
    }

    // Reach, not just body contact: collision holds Kiran at exactly 15 + radius, and a
    // rooted (shielded) boss never steps back into him, so a body-contact check almost
    // never fired. Bosses swing with a 30px reach past their own edge.
    if (edist < (30 + e.radius) && e.hitCooldown <= 0) {
      e.hitCooldown = 750;
      this.enemyLunge(e);
      if (this.damagePlayer(e.contactDmg * PHASE_DEFS[this.phase].enemyDmgMult, e, 'melee')) return true;
      if (this.player.trinket && this.player.trinket.effect === 'thorns' && !e.shieldOn) {
        this.damageEnemy(e, e.contactDmg * this.player.trinket.reflectPct);
        if (e.hp <= 0) return false;
      }
    }

    // Summons keep low-value Asura flowing through a boss fight - pressure, and
    // Tejas charge for a player patient enough to farm it before committing.
    e.summonTimer -= delta;
    if (e.summonTimer <= 0) {
      e.summonTimer = e.summonEvery;
      // Capped per boss: uncapped summons crowded the arena so the auto-attack (which
      // targets the nearest enemy) almost never reached the boss - one test fight ran
      // 3.4 minutes.
      const alive = this.enemies.filter(m => m.summonedBy === e.id).length;
      if (this.enemies.length < 14 && alive < 4) {
        const b = this.arenaBounds;
        for (let i = 0; i < 2; i++) {
          const a = Math.random() * Math.PI * 2;
          const m = this.spawnEnemyOfType('melee',
            Phaser.Math.Clamp(e.x + Math.cos(a) * (e.radius + 30), b.x + 16, b.right - 16),
            Phaser.Math.Clamp(e.y + Math.sin(a) * (e.radius + 30), b.y + 16, b.bottom - 16),
            this.depth, false);
          m.summonedBy = e.id;
        }
      }
    }

    if (!e.slam) {
      e.slamTimer -= delta;
      if (e.slamTimer <= 0) this.beginSlam(e);
    } else {
      e.slam.t += delta;
      this.drawSlamTelegraph(e);
      if (e.slam.t >= e.slam.dur && this.resolveSlam(e)) return true;
    }
    return false;
  }

  beginSlam(e) {
    // A shielded (rooted) boss cannot walk to you, so it reaches out instead.
    const type = e.shieldOn ? 'scatter' : Phaser.Utils.Array.GetRandom(e.slamTypes);
    const b = this.arenaBounds;
    const clampX = x => Phaser.Math.Clamp(x, b.x + 10, b.right - 10);
    const clampY = y => Phaser.Math.Clamp(y, b.y + 10, b.bottom - 10);
    const slam = { type, t: 0, dur: SLAM[type].windup, x: e.x, y: e.y };

    if (type === 'circle') {
      slam.r = e.slamRadius;
    } else if (type === 'line') {
      slam.a = Math.atan2(this.player.y - e.y, this.player.x - e.x);   // aimed where you stand NOW
      slam.len = 280; slam.w = 48;
    } else {
      const n = e.isMega ? 6 : 4;
      slam.blobs = [];
      for (let i = 0; i < n; i++) {
        const off = i === 0 ? 0 : Phaser.Math.Between(42, 118);           // one always on you
        const a = Math.random() * Math.PI * 2;
        slam.blobs.push({ x: clampX(this.player.x + Math.cos(a) * off),
                          y: clampY(this.player.y + Math.sin(a) * off), r: 36, delay: i * 90 });
      }
    }
    // Reusing telegraphGfx means killEnemy and run cleanup already destroy it.
    e.telegraphGfx = this.add.graphics().setDepth(Z.telegraph);
    e.slam = slam;
    SLAM_WARN[type].forEach(([ms, rate]) => {
      if (ms) this.time.delayedCall(ms, () => this.sfx('slam-warn', { rate }));
      else this.sfx('slam-warn', { rate });
    });
    this.hint('slam', 'RED ZONE! A slam lands when the bright fill reaches the edge - get out of it!', true);
  }

  drawSlamTelegraph(e) {
    const s = e.slam, g = e.telegraphGfx;
    if (!g) return;
    const p = Math.min(1, s.t / s.dur);
    const warn = 0xff3b1f, pulse = 0.5 + 0.5 * Math.sin(s.t / 55);
    g.clear();
    // Read: faint = the danger zone, bright fill = how close it is to landing.
    // When the fill reaches the edge, it lands.
    const under = 0x1a0000;
    if (s.type === 'circle') {
      g.fillStyle(under, 0.34); g.fillCircle(s.x, s.y, s.r);
      g.fillStyle(warn, 0.12); g.fillCircle(s.x, s.y, s.r);
      g.fillStyle(warn, 0.26 + 0.14 * pulse); g.fillCircle(s.x, s.y, s.r * p);
      g.lineStyle(3, warn, 0.95); g.strokeCircle(s.x, s.y, s.r);
    } else if (s.type === 'line') {
      const quad = len => {
        const c = Math.cos(s.a), sn = Math.sin(s.a), hw = s.w / 2;
        return [s.x - sn*hw, s.y + c*hw,  s.x + c*len - sn*hw, s.y + sn*len + c*hw,
                s.x + c*len + sn*hw, s.y + sn*len - c*hw,  s.x + sn*hw, s.y - c*hw];
      };
      const draw = (pts, fill, a, colour = warn) => {
        g.beginPath(); g.moveTo(pts[0], pts[1]);
        for (let i = 2; i < 8; i += 2) g.lineTo(pts[i], pts[i+1]);
        g.closePath();
        if (fill) { g.fillStyle(colour, a); g.fillPath(); } else { g.lineStyle(3, colour, a); g.strokePath(); }
      };
      draw(quad(s.len), true, 0.34, under);
      draw(quad(s.len), true, 0.12);
      draw(quad(s.len * p), true, 0.26 + 0.14 * pulse);
      draw(quad(s.len), false, 0.95);
    } else {
      s.blobs.forEach(bl => {
        const bp = Phaser.Math.Clamp((s.t - bl.delay) / (s.dur - bl.delay), 0, 1);
        g.fillStyle(under, 0.34); g.fillCircle(bl.x, bl.y, bl.r);
        g.fillStyle(warn, 0.12); g.fillCircle(bl.x, bl.y, bl.r);
        g.fillStyle(warn, 0.26 + 0.14 * pulse); g.fillCircle(bl.x, bl.y, bl.r * bp);
        g.lineStyle(2.5, warn, 0.9); g.strokeCircle(bl.x, bl.y, bl.r);
      });
    }
  }

  // Returns true if the player died.
  resolveSlam(e) {
    const s = e.slam;
    e.slam = null;
    if (e.telegraphGfx) { e.telegraphGfx.destroy(); e.telegraphGfx = null; }
    e.slamTimer = e.slamCooldown + Phaser.Math.Between(-250, 350);

    const px = this.player.x, py = this.player.y;
    let hit = false;
    if (s.type === 'circle') {
      this.shockwave(s.x, s.y, s.r, 0xff6a3d);
      hit = Math.hypot(px - s.x, py - s.y) <= s.r;
    } else if (s.type === 'line') {
      const dx = px - s.x, dy = py - s.y;
      const along = dx * Math.cos(s.a) + dy * Math.sin(s.a);
      const across = -dx * Math.sin(s.a) + dy * Math.cos(s.a);
      hit = along >= 0 && along <= s.len && Math.abs(across) <= s.w / 2;
      this.lineImpact(s);
    } else {
      s.blobs.forEach(bl => {
        this.shockwave(bl.x, bl.y, bl.r, 0xff6a3d);
        if (Math.hypot(px - bl.x, py - bl.y) <= bl.r) hit = true;   // one hit per slam, not per blob
      });
    }
    this.shake(230, SLAM[s.type].shake);
    this.sfx('slam-land', { rate: e.isMega ? 0.8 : 1 });
    return hit ? this.damagePlayer(this.slamDamage(SLAM[s.type].pct), e, 'slam') : false;
  }

  // Flat part scales with depth and sector; the percentage part scales with the
  // player's own max HP, which is what keeps slams dangerous against HP stacking.
  // Sector 1 only gets 60% of the percentage so a first Bakasura is a lesson, not a wall.
  slamDamage(pct) {
    const flat = (14 + this.depth * 1.6) * sectorDmgMult(this.sector);
    const pctScale = Math.min(1, 0.6 + 0.2 * (this.sector - 1));
    return (flat + this.player.maxHp * pct * pctScale) * PHASE_DEFS[this.phase].enemyDmgMult;
  }

  shockwave(x, y, r, colour) {
    const flash = this.add.circle(x, y, r, colour, 0.38).setDepth(Z.fx);
    this.tweens.add({ targets: flash, alpha: 0, duration: 260, onComplete: () => flash.destroy() });
    const ring = this.add.circle(x, y, r * 0.5, 0x000000, 0).setStrokeStyle(4, colour, 0.95).setDepth(Z.fx);
    this.tweens.add({ targets: ring, scale: 2.4, alpha: 0, duration: 340, ease: 'Cubic.easeOut',
                      onComplete: () => ring.destroy() });
    for (let i = 0; i < 8; i++) {                       // stone chips thrown outward
      const a = (i / 8) * Math.PI * 2 + Math.random() * 0.4;
      const chip = this.add.circle(x, y, 2.5, 0xe8a868, 0.9).setDepth(Z.fx);
      this.tweens.add({ targets: chip, x: x + Math.cos(a) * r * 1.1, y: y + Math.sin(a) * r * 1.1,
                        alpha: 0, duration: 380, ease: 'Cubic.easeOut', onComplete: () => chip.destroy() });
    }
  }

  lineImpact(s) {
    const g = this.add.graphics().setDepth(Z.fx);
    const c = Math.cos(s.a), sn = Math.sin(s.a), hw = s.w / 2;
    g.fillStyle(0xff6a3d, 0.5);
    g.beginPath();
    g.moveTo(s.x - sn*hw, s.y + c*hw);
    g.lineTo(s.x + c*s.len - sn*hw, s.y + sn*s.len + c*hw);
    g.lineTo(s.x + c*s.len + sn*hw, s.y + sn*s.len - c*hw);
    g.lineTo(s.x + sn*hw, s.y - c*hw);
    g.closePath(); g.fillPath();
    this.tweens.add({ targets: g, alpha: 0, duration: 300, onComplete: () => g.destroy() });
    for (let t = 0.15; t < 1; t += 0.2) this.shockwave(s.x + c * s.len * t, s.y + sn * s.len * t, 18, 0xff6a3d);
  }

  // Bosses with an exposed weak core take full damage only in the matching phase.
  weakScale(e) {
    const gated = e.isBoss && (!e.isSectorBoss || e.bossPhase === 'timing');
    return gated && this.phase !== e.weakPhase ? 0.12 : 1;
  }

  // One door for all player-sourced damage to an enemy: shields, boss weak phases and
  // the Vritra transition live here, so the auto-attack and Tejas can never disagree.
  // Returns true if the enemy died.
  damageEnemy(e, dmg) {
    if (!e || e.hp <= 0) return false;
    if (e.shieldOn) return false;
    e.hp -= dmg * this.weakScale(e);
    // Vritra must pass through its shield phase: clamp a big hit at the 55% line
    // instead of letting it skip the second half of the fight.
    if (e.isMega && e.bossPhase === 'timing' && e.hp <= e.maxHp * 0.55) {
      e.hp = Math.max(e.hp, e.maxHp * 0.55);
      this.transitionMegaBossToShield(e);
      return false;
    }
    if (e.hp <= 0) { this.killEnemy(e); return true; }
    return false;
  }

  // ---------- FLOOR ART ----------
  floorKey(sector) {
    const theme = (sector - 1) % FLOORS.length, cycle = Math.min(2, Math.floor((sector - 1) / FLOORS.length));
    const key = `floor-${theme}-${cycle}`;
    if (!this.textures.exists(key)) this.paintFloor(key, FLOORS[theme], cycle);
    return key;
  }

  paintFloor(key, theme, cycle) {
    const b = this.arenaBounds, px = Math.min(RES, 2);     // floors are soft art: 2x is plenty, and a third of the memory of 3x
    const tex = this.textures.createCanvas(key, Math.round(b.width * px), Math.round(b.height * px));
    const ctx = tex.getContext(), w = b.width, h = b.height;
    ctx.scale(px, px);
    theme.paint(ctx, w, h, px);
    // The endless descent: past Sector 3 the same three levels return under a deepening wash.
    if (cycle) {
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = cycle === 1 ? '#d99aa6' : '#9c86c2';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }
    // Shade the edges, so the floor sits below the stairs around it.
    const shade = (x0, y0, x1, y1, rx, ry, rw, rh) => {
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, 'rgba(20,4,0,0.5)'); g.addColorStop(1, 'rgba(20,4,0,0)');
      ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
    };
    shade(0, 0, 0, 26, 0, 0, w, 26); shade(0, h, 0, h - 20, 0, h - 20, w, 20);
    shade(0, 0, 22, 0, 0, 0, 22, h); shade(w, 0, w - 22, 0, w - 22, 0, 22, h);
    tex.refresh();
  }

  // Swap the floor for this sector's. With `fade` the new one rises through the old.
  setFloor(sector, fade) {
    const key = this.floorKey(sector), b = this.arenaBounds, theme = FLOORS[(sector - 1) % FLOORS.length];
    this.starfield.setTint(theme.ember).setAlpha(theme.emberAlpha);
    this.floorEdge.setStrokeStyle(1, theme.edge, 0.7);
    const top = this.floorLayers[this.floorLayers.length - 1];
    if (top && top.texture.key === key) return;
    const img = this.add.image(b.centerX, b.centerY, key).setDisplaySize(b.width, b.height).setDepth(Z.floor);
    const older = this.floorLayers.slice();
    this.floorLayers.push(img);
    const drop = () => {
      older.forEach(o => { this.tweens.killTweensOf(o); o.destroy(); });
      this.floorLayers = this.floorLayers.filter(o => !older.includes(o));
    };
    if (fade && older.length) { img.setAlpha(0); this.tweens.add({ targets: img, alpha: 1, duration: 900, onComplete: drop }); }
    else drop();
  }

  // The stairs around every arena: two courses of saw-tooth steps climbing away on all
  // four sides, the pattern that makes Chand Baori instantly recognisable from above.
  drawWellFrame() {
    const b = this.arenaBounds, g = this.add.graphics().setDepth(Z.floor - 0.5);
    const courses = 2, ch = MARGIN / courses, tooth = 20;
    for (let c = courses - 1; c >= 0; c--) {
      const near = c * ch, far = (c + 1) * ch;                       // distance out from the arena edge
      const light = c === 0 ? 0xc88a46 : 0x8a5526, dark = c === 0 ? 0x6e3c15 : 0x47240b;
      const L = b.x - far, R = b.right + far, T = b.y - far, B = b.bottom + far;
      g.fillStyle(dark, 1);
      g.fillRect(L, T, R - L, ch); g.fillRect(L, B - ch, R - L, ch);
      g.fillRect(L, T, ch, B - T); g.fillRect(R - ch, T, ch, B - T);
      g.fillStyle(light, 1);
      const nx = Math.round((b.width + near * 2) / tooth), sx = (b.width + near * 2) / nx, half = c % 2 ? 0.5 : 0;
      for (let i = -1; i <= nx; i++) {
        const x0 = b.x - near + (i + half) * sx, x1 = x0 + sx, xm = x0 + sx / 2;
        if (x1 <= b.x - near || x0 >= b.right + near) continue;
        g.fillTriangle(x0, b.y - near, x1, b.y - near, xm, b.y - far);               // top
        g.fillTriangle(x0, b.bottom + near, x1, b.bottom + near, xm, b.bottom + far); // bottom
      }
      const ny = Math.round((b.height + near * 2) / tooth), sy = (b.height + near * 2) / ny;
      for (let i = -1; i <= ny; i++) {
        const y0 = b.y - near + (i + half) * sy, y1 = y0 + sy, ym = y0 + sy / 2;
        if (y1 <= b.y - near || y0 >= b.bottom + near) continue;
        g.fillTriangle(b.x - near, y0, b.x - near, y1, b.x - far, ym);                // left
        g.fillTriangle(b.right + near, y0, b.right + near, y1, b.right + far, ym);    // right
      }
      g.lineStyle(1, 0x2a0f04, 0.8); g.strokeRect(L, T, R - L, B - T);
    }
    // The half-teeth of the outer course spill past the frame's corners; square them off.
    g.fillStyle(0x47240b, 1);
    for (const [x, y] of [[0, b.y - MARGIN], [b.right, b.y - MARGIN], [0, b.bottom], [b.right, b.bottom]]) g.fillRect(x, y, MARGIN, MARGIN);
    g.lineStyle(1, 0x8a5526, 0.9);
    g.lineBetween(0, b.y - MARGIN, MARGIN, b.y); g.lineBetween(W, b.y - MARGIN, b.right, b.y);
    g.lineBetween(0, b.bottom + MARGIN, MARGIN, b.bottom); g.lineBetween(W, b.bottom + MARGIN, b.right, b.bottom);
  }

  // ---------- TITLE SCREEN ----------
  makeMenuTextures() {
    if (this.textures.exists('coreglow')) return;
    const glow = this.textures.createCanvas('coreglow', 256, 256), gc = glow.getContext();
    const rg = gc.createRadialGradient(128, 128, 0, 128, 128, 128);
    rg.addColorStop(0, 'rgba(255,246,206,1)'); rg.addColorStop(0.22, 'rgba(255,196,80,0.8)');
    rg.addColorStop(0.55, 'rgba(255,120,24,0.28)'); rg.addColorStop(1, 'rgba(255,90,10,0)');
    gc.fillStyle = rg; gc.fillRect(0, 0, 256, 256); glow.refresh();
    // Dusk at the top and bottom of the screen, so the words sit on something calm.
    const veil = this.textures.createCanvas('menuveil', 4, H), vc = veil.getContext();
    const lg = vc.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, 'rgba(34,6,0,0.74)'); lg.addColorStop(0.17, 'rgba(34,6,0,0.36)'); lg.addColorStop(0.27, 'rgba(34,6,0,0)');
    lg.addColorStop(0.55, 'rgba(34,6,0,0)'); lg.addColorStop(0.66, 'rgba(34,6,0,0.78)'); lg.addColorStop(1, 'rgba(26,4,0,0.94)');
    vc.fillStyle = lg; vc.fillRect(0, 0, 4, H); veil.refresh();
  }

  // Looking straight down the well. Every tier is a square ring of four stair-walls; the
  // rings grow as we sink, and when one has grown a whole tier the cycle starts again, so
  // the descent never ends.
  drawWell(time) {
    const g = this.menu.g, cx = W / 2, cy = WELL.cy;
    const t = (time / WELL.period) % 1, sway = Math.sin(time / 4300) * 0.06;
    const corners = (r, a) => {
      const c = Math.cos(a) * r, sn = Math.sin(a) * r;
      return [{ x: cx - c + sn, y: cy - sn - c }, { x: cx + c + sn, y: cy + sn - c }, { x: cx + c - sn, y: cy + sn + c }, { x: cx - c - sn, y: cy - sn + c }];
    };
    const mix = (p, q, f) => ({ x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f });
    g.clear();
    for (let i = 0; i < WELL.tiers; i++) {
      const d = i - t, ro = WELL.size * Math.pow(WELL.k, d);
      const O = corners(ro, d * WELL.twist + sway), I = corners(ro * WELL.k, (d + 1) * WELL.twist + sway);
      for (let side = 0; side < 4; side++) {
        const a = O[side], b = O[(side + 1) % 4], c = I[(side + 1) % 4], e = I[side];
        g.fillStyle(wellColour(d + 0.5, WELL.shade[side] * 0.6), 1);
        g.fillPoints([a, b, c, e], true);
        g.fillStyle(wellColour(d + 0.5, WELL.shade[side]), 1);
        for (let k = 0; k < WELL.steps; k++) {
          const p0 = mix(a, b, k / WELL.steps), p1 = mix(a, b, (k + 1) / WELL.steps), q = mix(e, c, (k + 0.5) / WELL.steps);
          g.fillTriangle(p0.x, p0.y, p1.x, p1.y, q.x, q.y);
        }
      }
      g.lineStyle(1, wellColour(d, 1.3), 0.55);
      g.strokePoints(O, true);
    }
    this.menu.embers.tilePositionY += 0.5;
  }

  // ---------- ATTACK VISUALS ----------
  // Every weapon used to draw the same cyan line, so a Venom Blade and an Executioner
  // felt identical to use. Each effect now has its own beam shape and colour, which is
  // also free build feedback: you can see what you're holding without reading the HUD.
  drawWeaponBeam(x1, y1, x2, y2, effect) {
    const fx = this.attackFx;
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const len = Math.hypot(x2 - x1, y2 - y1);

    switch (effect) {
      case 'venom': {            // sickly, dripping - beads of poison along the path
        fx.lineStyle(2, 0x7fdd3c, 0.75);
        fx.lineBetween(x1, y1, x2, y2);
        fx.fillStyle(0x7fdd3c, 0.9);
        for (let t = 0.25; t < 1; t += 0.25) {
          const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
          fx.fillCircle(px, py + Math.sin(t * 9) * 3, 2.6);
        }
        break;
      }
      case 'vampiric': {         // crimson draw, thicker at the victim end
        fx.lineStyle(4, 0xc4331f, 0.55); fx.lineBetween(x1, y1, x2, y2);
        fx.lineStyle(1.5, 0xff8080, 0.95); fx.lineBetween(x1, y1, x2, y2);
        fx.fillStyle(0xff8080, 0.9); fx.fillCircle(x2, y2, 4);
        break;
      }
      case 'chain': {            // jagged arc rather than a straight line
        fx.lineStyle(2, 0x4dd0ff, 0.95);
        fx.beginPath(); fx.moveTo(x1, y1);
        const steps = Math.max(3, Math.round(len / 22));
        for (let i = 1; i < steps; i++) {
          const t = i / steps;
          const off = (i % 2 ? 1 : -1) * Phaser.Math.Between(4, 9);
          fx.lineTo(x1 + (x2-x1)*t + Math.cos(ang + Math.PI/2) * off,
                    y1 + (y2-y1)*t + Math.sin(ang + Math.PI/2) * off);
        }
        fx.lineTo(x2, y2); fx.strokePath();
        break;
      }
      case 'executioner': {      // heavy gold wedge - widens toward the target
        const n = ang + Math.PI/2;
        fx.fillStyle(FORGE.gold, 0.6);
        fx.beginPath();
        fx.moveTo(x1 + Math.cos(n)*1.5, y1 + Math.sin(n)*1.5);
        fx.lineTo(x2 + Math.cos(n)*7,   y2 + Math.sin(n)*7);
        fx.lineTo(x2 - Math.cos(n)*7,   y2 - Math.sin(n)*7);
        fx.lineTo(x1 - Math.cos(n)*1.5, y1 - Math.sin(n)*1.5);
        fx.closePath(); fx.fillPath();
        break;
      }
      default: {                 // plain weapon: clean, quick, unremarkable on purpose
        fx.lineStyle(2, FORGE.cool, 0.8);
        fx.lineBetween(x1, y1, x2, y2);
      }
    }
  }

  // Short-lived burst where a hit lands. Destroys itself, so it needs no bookkeeping
  // in the run-cleanup path.
  impactBurst(x, y, colour) {
    const ring = this.add.circle(x, y, 5, colour, 0.55);
    this.tweens.add({
      targets: ring, scale: 2.4, alpha: 0,
      duration: 180, ease: 'Cubic.easeOut',
      onComplete: () => ring.destroy()
    });
  }

  // ---------- LOOT ICONS ----------
  // Drawn once into textures at boot rather than shipped as files: they stay exactly
  // on-palette, cost nothing to download, and one texture serves every rarity because
  // the rarity colour is applied as a tint at pickup time.
  makeLootIcons() {
    const S = 32, C = S / 2;
    const g = this.make.graphics({ add: false });
    const ink = 0xfffbef;
    const def = (key, draw) => {
      g.clear();
      g.fillStyle(ink, 1); g.lineStyle(3, ink, 1);
      draw(g);
      g.generateTexture('icon_' + key, S, S);
    };

    // --- weapons ---
    def('none', g => {                      // plain blade
      g.fillTriangle(C, 3, C - 5, 14, C + 5, 14);
      g.fillRect(C - 4, 14, 8, 11);
      g.fillRect(C - 8, 24, 16, 4);
    });
    def('venom', g => {                     // droplet
      g.fillTriangle(C, 4, C - 8, 17, C + 8, 17);
      g.fillCircle(C, 19, 8);
    });
    def('vampiric', g => {                  // paired fangs
      g.fillTriangle(C - 7, 5, C - 1, 5, C - 4, 24);
      g.fillTriangle(C + 1, 5, C + 7, 5, C + 4, 24);
      g.fillRect(C - 9, 4, 18, 4);
    });
    def('chain', g => {                     // two interlocked links
      g.strokeCircle(C - 5, C, 7);
      g.strokeCircle(C + 5, C, 7);
    });
    def('executioner', g => {               // axe head
      g.fillRect(C - 2, 4, 4, 24);
      g.beginPath(); g.moveTo(C + 1, 6); g.lineTo(C + 13, 12);
      g.lineTo(C + 13, 20); g.lineTo(C + 1, 24); g.closePath(); g.fillPath();
    });

    // --- trinkets ---
    def('vitality', g => {                  // heart
      g.fillCircle(C - 5, 12, 6); g.fillCircle(C + 5, 12, 6);
      g.fillTriangle(C - 11, 14, C + 11, 14, C, 28);
    });
    def('aegis', g => {                     // shield
      g.beginPath(); g.moveTo(C, 3); g.lineTo(C + 11, 9); g.lineTo(C + 9, 21);
      g.lineTo(C, 29); g.lineTo(C - 9, 21); g.lineTo(C - 11, 9);
      g.closePath(); g.fillPath();
    });
    def('thorns', g => {                    // spiked ring
      g.strokeCircle(C, C, 7);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        g.lineBetween(C + Math.cos(a) * 8, C + Math.sin(a) * 8,
                      C + Math.cos(a) * 14, C + Math.sin(a) * 14);
      }
    });
    def('swift', g => {                     // stacked chevrons
      for (const dy of [0, 9]) {
        g.beginPath(); g.moveTo(C - 9, 8 + dy); g.lineTo(C, 15 + dy); g.lineTo(C + 9, 8 + dy);
        g.strokePath();
      }
    });
    def('regen', g => {                     // cross
      g.fillRect(C - 3, 6, 6, 20);
      g.fillRect(6, C - 3, 20, 6);
    });

    // --- unidentified ---
    def('mystery', g => {
      g.strokeCircle(C, C, 11);
      g.fillCircle(C, C, 3);
    });

    g.destroy();
  }

  // ---------- UI HELPERS ----------
  clearUI() {
    this.uiObjects.forEach(o => { this.tweens.killTweensOf(o); o.destroy(); });
    this.uiObjects = [];
    this.menu = null;
  }

  makeButton(x, y, w, h, label, color, onClick, opts = {}) {
    const bg = this.add.rectangle(x, y, w, h, color)
      .setStrokeStyle(2, opts.stroke || FORGE.bronze, opts.stroke ? 0.9 : 0.55).setInteractive({ useHandCursor: true });
    const txt = this.add.text(x, y, label, { resolution: RES, fontSize: (opts.size || 16) + 'px', color: opts.color || '#fffbef', fontStyle: 'bold' }).setOrigin(0.5);
    bg.on('pointerdown', () => { if (opts.sound !== null) this.sfx(opts.sound || 'ui-click'); onClick(); });
    this.uiObjects.push(bg, txt);
    return bg;
  }

  // ---------- TITLE SCREEN / HUB ----------
  // One screen, not two: the title, the way into a run, and the two upgrades. A separate
  // title in front of a separate hub would put three taps between a player and a fight.
  showHub() {
    this.clearUI();
    this.state = 'hub';
    this.hudText.setText('');
    this.showPauseButton(false);
    this.setFloor(1);
    this.playMusic('hub');
    this.makeMenuTextures();

    const cx = W / 2, cy = WELL.cy;
    const g = this.add.graphics().setDepth(10);
    const embers = this.add.tileSprite(cx, H / 2, W, H, 'bg_stars').setTint(FORGE.gold).setAlpha(0.3).setDepth(10.2);
    const glow = this.add.image(cx, cy, 'coreglow').setDisplaySize(250, 250).setDepth(10.3).setBlendMode(Phaser.BlendModes.ADD);
    const veil = this.add.image(cx, H / 2, 'menuveil').setDisplaySize(W, H).setDepth(10.5);
    this.uiObjects.push(g, embers, glow, veil);
    this.menu = { g, embers };
    this.tweens.add({ targets: glow, scale: glow.scale * 1.14, alpha: 0.78, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.drawWell(this.time.now);

    const say = (x, y, str, style) => {
      const t = this.add.text(x, y, str, Object.assign({ resolution: RES }, style)).setOrigin(0.5);
      this.uiObjects.push(t);
      return t;
    };
    say(cx, 84, GAME_TITLE, { fontSize: '54px', color: '#ffd23c', display: true,
      shadow: { offsetX: 0, offsetY: 3, color: '#5c2a05', blur: 8, fill: true } });
    say(cx, 128, 'auto-battle · collect loot · descend deeper', { fontSize: '12px', color: '#e8c690' });

    // The way in sits at the bottom of the well: you press the light you are falling toward.
    const ring = this.add.circle(cx, cy, 60, 0x000000, 0).setStrokeStyle(2, FORGE.gold, 0.8);
    const core = this.add.circle(cx, cy, 54, BTN.primary, 0.96).setStrokeStyle(3, FORGE.gold, 1)
      .setInteractive(new Phaser.Geom.Circle(54, 54, 54), Phaser.Geom.Circle.Contains);
    core.input.cursor = 'pointer';
    core.on('pointerdown', () => { this.sfx('ui-click'); this.startRun(); });
    this.uiObjects.push(ring, core);
    this.tweens.add({ targets: ring, scale: 1.3, alpha: 0, duration: 1700, repeat: -1, ease: 'Cubic.easeOut' });
    say(cx, cy - 5, 'DESCEND', { fontSize: '19px', color: '#fffbef', fontStyle: 'bold' });
    say(cx, cy + 16, 'start a run', { fontSize: '10px', color: '#ffe9a0' });

    say(cx, 436, session.bestSector ? `Deepest descent: Sector ${session.bestSector}` : 'No descent yet', { fontSize: '11px', color: '#c8a96e' });
    say(cx, 460, `${N.currency}: ${session.metaGold}`, { fontSize: '20px', color: '#ffd23c', fontStyle: 'bold' });

    // Exponential, not linear: linear costs let Vitality outgrow every sector. Levels
    // now plateau around 8-12 unless a player commits to many deep runs.
    const vitCost = Math.round(50 * Math.pow(1.45, session.vitalityLevel));
    const powCost = Math.round(60 * Math.pow(1.45, session.powerLevel));
    const buy = (cost, level) => () => {
      if (session.metaGold < cost) { this.sfx('ui-error'); return; }
      session.metaGold -= cost; session[level]++; saveSession();
      this.sfx('ui-confirm');
      this.showHub();
    };
    const card = (x, name, level, effect, cost, key) => {
      const can = session.metaGold >= cost;
      this.uiObjects.push(this.add.rectangle(x, 530, 178, 96, FORGE.deep, 0.9).setStrokeStyle(1.5, can ? FORGE.gold : FORGE.bronze, can ? 0.9 : 0.4));
      say(x, 497, name, { fontSize: '11px', color: '#c8a96e', fontStyle: 'bold' });
      say(x, 515, `Lv. ${level}  ·  ${effect}`, { fontSize: '12px', color: '#fffbef' });
      this.makeButton(x, 550, 152, 32, `${cost} ${N.currency}`, can ? BTN.plain : BTN.off, buy(cost, key),
        { sound: null, size: 14, color: can ? '#fffbef' : '#8a7360' });
    };
    card(104, 'VITALITY', session.vitalityLevel, `+${session.vitalityLevel * 10}% max HP`, vitCost, 'vitalityLevel');
    card(296, 'POWER', session.powerLevel, `+${session.powerLevel * 8}% damage`, powCost, 'powerLevel');

    const locked = this.lockedPowerCount();
    say(cx, 598, locked > 0 ? `${locked} powers still locked — descend to find them` : 'all powers unlocked',
      { fontSize: '11px', color: locked > 0 ? '#ffd23c' : '#8a7360' });
    const small = (x, label, fn) => this.makeButton(x, 634, 88, 34, label, BTN.quiet, fn, { size: 11 });
    small(59,  'POWERS',      () => this.showCodex());
    small(153, 'HOW TO PLAY', () => this.showHowTo(0, () => this.closeOverlay()));
    small(247, 'SETTINGS',    () => this.showSettings(() => this.closeOverlay()));
    small(341, 'FEEDBACK',    () => Feedback.open());
    say(cx, 676, 'build ' + BUILD, { fontSize: '8px', color: '#6b4a2e' });

    // Everything above sits over the well, which itself covers the arena and the HUD.
    this.uiObjects.forEach(o => { if (o.depth === 0) o.setDepth(o.type === 'Text' ? 13 : 12); });
  }

  // ---------- CODEX ----------
  // How many effects the player has not yet reached the depth to see drop. Surfaced on
  // the hub button because "3 still locked" is a far better reason to press Descend
  // than any amount of copy about replayability.
  lockedPowerCount() {
    const reached = session.bestSector || 1;
    const items = [...Object.entries(WEAPON_EFFECTS), ...Object.entries(TRINKET_EFFECTS)]
      .filter(([k, e]) => k !== 'none' && e.minSector > reached).length;
    return items + (session.tejasUnlocked ? 0 : 1);
  }

  // Tabbed so it scales: three short pages instead of one tall list that overflowed its
  // border on narrow screens. Every line is word-wrapped to the panel width.
  showCodex(tab = 'weapons') {
    this.clearUI();
    this.state = 'hub';
    const reached = session.bestSector || 1;
    const b = this.arenaBounds;
    const textX = 80, wrap = b.right - textX - 12;       // never past the arena border

    // A backing panel keeps the text readable over the rangoli floor.
    this.uiObjects.push(this.add.rectangle(b.centerX, b.centerY, b.width, b.height, FORGE.deep, 0.78));
    this.uiObjects.push(this.add.text(W/2, 30, 'POWERS', { resolution: RES, fontSize: '22px', color: '#ffd23c', fontStyle: 'bold' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, 56, `found in the depths · best sector ${reached}`, { resolution: RES, fontSize: '11px', color: '#c8a96e' }).setOrigin(0.5));

    const tabs = [['weapons', 'WEAPONS'], ['trinkets', 'TRINKETS'], ['tejas', N.supercharge.toUpperCase()]];
    tabs.forEach(([key, label], i) => {
      const tx = b.centerX + (i - 1) * 110, active = key === tab;
      const btn = this.add.rectangle(tx, b.y + 24, 100, 30, active ? 0x7a3a0a : 0x3a1a08, 1)
        .setStrokeStyle(1, active ? FORGE.gold : FORGE.bronze, active ? 1 : 0.5)
        .setInteractive({ useHandCursor: true });
      btn.on('pointerdown', () => { this.sfx('ui-page'); this.showCodex(key); });
      const t = this.add.text(tx, b.y + 24, label, { resolution: RES, fontSize: '11px', fontStyle: 'bold',
        color: active ? '#ffd23c' : '#c8a96e' }).setOrigin(0.5);
      this.uiObjects.push(btn, t);
    });

    const row = (y, iconKey, tint, title, gloss, body, unlocked) => {
      const dim = !unlocked;
      this.uiObjects.push(
        this.add.image(48, y, `icon_${iconKey}`).setDisplaySize(28, 28).setTint(dim ? 0x5a4535 : tint),
        this.add.text(textX, y - 17, title, { resolution: RES, fontSize: '13px', fontStyle: 'bold',
          color: dim ? '#7a6656' : '#fffbef', wordWrap: { width: wrap } }),
        this.add.text(textX, y - 1, gloss, { resolution: RES, fontSize: '10px', fontStyle: 'italic',
          color: dim ? '#6b5847' : '#e8a868', wordWrap: { width: wrap } }),
        this.add.text(textX, y + 13, body, { resolution: RES, fontSize: '10px',
          color: dim ? '#6b5847' : '#c8a96e', wordWrap: { width: wrap } })
      );
    };

    let y = b.y + 84;
    const step = 66;
    if (tab === 'weapons' || tab === 'trinkets') {
      const table = tab === 'weapons' ? WEAPON_EFFECTS : TRINKET_EFFECTS;
      const tint = tab === 'weapons' ? 0xff8c42 : 0x4dd0ff;
      for (const [key, def] of Object.entries(table)) {
        if (key === 'none') continue;                     // the starting Katar is not a discovery
        const unlocked = def.minSector <= reached;
        row(y, key, tint, def.label, def.meaning,
            unlocked ? def.desc : `Locked — reaches you in Sector ${def.minSector}`, unlocked);
        y += step;
      }
      this.uiObjects.push(this.add.text(b.centerX, y + 6,
        `${metalList()}. Finer metal, stronger effect. About 1 drop in 4 is unidentified: riskier, better odds.`,
        { resolution: RES, fontSize: '10px', color: '#8a7360', align: 'center', wordWrap: { width: b.width - 40 } }).setOrigin(0.5, 0));
    } else {
      const on = session.tejasUnlocked;
      this.uiObjects.push(this.add.text(b.centerX, y - 22,
        on ? `Kill to charge. When full, tap ${N.supercharge.toUpperCase()} (or Space) to unleash. The form follows your weapon.`
           : `Locked — ${N.supercharge} awakens the first time you reach Sector ${TEJAS_UNLOCK_SECTOR}.`,
        { resolution: RES, fontSize: '10px', color: on ? '#e8a868' : '#ffd23c', align: 'center',
          wordWrap: { width: b.width - 40 } }).setOrigin(0.5, 0.5));
      y += 24;
      for (const [key, f] of Object.entries(TEJAS_FORMS)) {
        row(y, key, f.colour, f.name, `${f.meaning} · with ${WEAPON_EFFECTS[key].label}`, f.desc, on);
        y += step - 4;
      }
    }

    this.makeButton(W/2, H - 56, 160, 40, 'BACK', 0x5c2a05, () => this.showHub());
  }

  // ---------- RUN SETUP ----------
  startRun() {
    this.clearUI();
    this.state = 'playing';

    // Satchel: items swapped out during this run, so a pickup no longer destroys
    // whatever you were holding. Run-scoped by design - carrying loot between runs
    // would undermine the Extract/Descend decision (2.5).
    this.inventory = [];
    this.invOpen = false;

    this.tejas = 0;          // 0-100
    this.tejasActive = 0;    // ms of the active form remaining
    this.tejasTick = 0;

    // Cosmic Cycle state - continuous, learnable timer independent of waves
    this.phase = 'drift';
    this.phaseTimeLeft = PHASE_DEFS.drift.duration;
    this.convergenceCountdown = CONVERGENCE_INTERVAL;
    this.inConvergence = false;
    this.savedPhase = null;
    this.savedPhaseTimeLeft = null;

    // Sector/depth state - runs are no longer capped at one 5-wave block
    this.sector = 1;
    this.depth = 0;

    // mood tint over the arena that shifts with the current phase (procedural, no art needed)
    const arenaCy = HUD_H + (H-HUD_H)/2;
    this.phaseTint = this.add.rectangle(W/2, arenaCy, W - MARGIN*2, H - HUD_H - MARGIN*2, PHASE_DEFS.drift.tint, PHASE_DEFS.drift.tintAlpha)
      .setDepth(Z.tint);   // over the floor, under telegraphs - it must never dim a slam warning

    const baseMaxHP = 100 * (1 + session.vitalityLevel * 0.10);
    this.player = {
      x: W/2, y: HUD_H + (H-HUD_H)/2,
      maxHp: baseMaxHP, hp: baseMaxHP,
      speed: 200,
      flashTimer: 0,
      shieldCharge: 0,
      shieldRechargeTimer: 0,
      // `type` matters now that the satchel can hand this back to applyLoot: without
      // it the starting Dagger fell through to the trinket branch and equipped itself
      // into the wrong slot. Every dropped item already carries one.
      weapon: { type: 'weapon', name: WEAPON_EFFECTS.none.label, rarity: 'common', shots: 1, effect: 'none', dmg: 10 * (1 + session.powerLevel * 0.08), range: 130, atkSpeed: 500 },
      trinket: null
    };
    this.playerFacing = 'front';
    this.playerSprite = this.add.image(this.player.x, this.player.y, `${CHARS.player}-front`).setDisplaySize(44, 44);
    // The ring stays a vector circle: it is the phase-colour tell, and must not inherit ship art.
    // Stance ring at Kiran's feet, not a circle around the body - a ring around a
    // character sprite reads as a bubble, but on the floor it reads as a stance and
    // leaves the silhouette clean. This is the Cosmic Cycle phase tell.
    this.playerRing = this.add.ellipse(this.player.x, this.player.y + 16, 34, 13, 0xffffff, 0)
      .setStrokeStyle(2, PHASE_DEFS.drift.color, 0.9);

    // HP bar
    const barX = 14, barY = 24, barW = W - 28, barH = 8;
    this.hpBarBg = this.add.rectangle(barX, barY, barW, barH, 0x2a0f04).setOrigin(0,0.5).setStrokeStyle(1, 0x6b4a2e);
    this.hpBarFill = this.add.rectangle(barX, barY, barW, barH, 0x2fbf71).setOrigin(0,0.5);
    this.hpBarW = barW;

    // Phase bar - big, prominent, drains as the current phase runs out. This replaces the old tiny dial.
    const pbarX = 14, pbarY = 42, pbarW = W - 28, pbarH = 14;
    this.phaseBarBg = this.add.rectangle(pbarX, pbarY, pbarW, pbarH, 0x2a0f04).setOrigin(0,0.5).setStrokeStyle(1, 0x6b4a2e);
    this.phaseBarFill = this.add.rectangle(pbarX, pbarY, pbarW, pbarH, PHASE_DEFS.drift.color).setOrigin(0,0.5);
    this.phaseBarLabel = this.add.text(pbarX + pbarW/2, pbarY, PHASE_DEFS.drift.label, { resolution: RES, fontSize: '11px', color: '#1a0600', fontStyle: 'bold' }).setOrigin(0.5);
    this.phaseBarW = pbarW;

    // Progress track - Dota-lane style: waves 1-5, gate at wave 3, ancient/flag at wave 5, moving marker
    const b = new Phaser.Geom.Rectangle(MARGIN, HUD_H + MARGIN, W - MARGIN*2, H - HUD_H - MARGIN*2);
    const trackY = b.y + 16;
    this.trackStartX = b.x + 34; this.trackEndX = b.right - 34;
    this.progressLine = this.add.rectangle((this.trackStartX+this.trackEndX)/2, trackY, this.trackEndX-this.trackStartX, 3, 0x6b4a2e);
    this.progressNodes = [];
    for (let i = 1; i <= 5; i++) {
      const nx = this.trackStartX + (this.trackEndX-this.trackStartX) * (i-1)/4;
      let node;
      if (i === GATEKEEPER_WAVE) node = this.add.rectangle(nx, trackY, 13, 13, 0x2a0f04).setAngle(45).setStrokeStyle(2, FORGE.flame);
      else if (i === 5) node = this.add.circle(nx, trackY, 10, 0x2a0f04).setStrokeStyle(2, 0xffd23c);
      else node = this.add.circle(nx, trackY, 7, 0x2a0f04).setStrokeStyle(2, 0x6b4a2e);
      this.progressNodes.push(node);
    }
    this.progressMarker = this.add.triangle(this.trackStartX, trackY+16, 0,0, -6,9, 6,9, 0xffd23c);
    this.trackY = trackY;
    this.sectorLabel = this.add.text(this.trackStartX - 14, trackY, 'S1', { resolution: RES, fontSize: '10px', color: '#8a7360', fontStyle: 'bold' }).setOrigin(1, 0.5);

    this.atkTimer = 0;
    this.attackFx = this.add.graphics();
    this.buildSatchelUI();
    if (session.tejasUnlocked) this.buildTejasUI();

    this.enemies = [];
    this.enemySprites = new Map();
    this.enemyCores = new Map();
    this.enemyRings = new Map();
    this.enemyShields = new Map();
    this.goldPickups = [];
    this.projectiles = [];
    this.pickups = [];

    this.runGold = 0;
    this.wave = 0;
    this.spawnQueue = [];
    this.spawnTimer = 0;

    this.showSectorBanner(this.sector);
    this.nextWave();
    this.showPauseButton(true);
    this.playMusic('combat');
    this.time.delayedCall(900, () => this.hint('move', this.sys.game.device.input.touch
      ? 'Drag anywhere to move. You attack on your own - just stay in range.'
      : 'Move with WASD or the arrow keys. You attack on your own - just stay in range.'));
  }

  showSectorBanner(n) {
    const t1 = this.add.text(W/2, H/2-40, `SECTOR ${n}`, { resolution: RES, stroke: '#2a0800', strokeThickness: 4, fontSize: '14px', color: '#e8c690', fontStyle: 'bold' }).setOrigin(0.5).setAlpha(0);
    const t2 = this.add.text(W/2, H/2-14, sectorTitle(n), { resolution: RES, stroke: '#2a0800', strokeThickness: 4, fontSize: '28px', color: '#ffd23c', fontStyle: 'bold' }).setOrigin(0.5).setAlpha(0);
    const t3 = this.add.text(W/2, H/2+16, sectorSub(n), { resolution: RES, stroke: '#2a0800', strokeThickness: 4, fontSize: '12px', color: '#f0dcc0' }).setOrigin(0.5).setAlpha(0);
    this.clearBanner();
    this.banner = [t1, t2, t3];
    this.banner.forEach(t => {
      this.tweens.add({ targets: t, alpha: 1, duration: 300, hold: 1500, yoyo: true, onComplete: () => t.destroy() });
    });
  }

  // Destroying twice is safe: Phaser ignores destroy() on an object that is already gone.
  clearBanner() {
    (this.banner || []).forEach(t => { this.tweens.killTweensOf(t); t.destroy(); });
    this.banner = null;
  }

  updateProgressTrack() {
    const idx = Math.min(this.wave, 5) - 1;
    const nx = this.trackStartX + (this.trackEndX-this.trackStartX) * idx/4;
    this.tweens.add({ targets: this.progressMarker, x: nx, duration: 300, ease: 'Cubic.easeOut' });
    this.progressNodes.forEach((node, i) => {
      if (i < this.wave-1) node.fillColor = 0x2fbf71;
      else if (i === this.wave-1) node.fillColor = 0xffd23c;
    });
    if (this.sectorLabel) this.sectorLabel.setText('S' + this.sector);
  }

  nextWave() {
    this.wave++;
    this.depth = (this.sector-1)*5 + this.wave;
    this.updateProgressTrack();

    if (this.wave > 5) {
      this.spawnSectorBoss();
      this.playMusic('boss');
      this.sfx('boom');
      const isMega = this.sector === MEGA_BOSS_SECTOR;
      this.showToast(isMega ? `${N.enemies.megaboss.toUpperCase()} AWAKENS` : `${N.enemies.sectorboss.toUpperCase()} STIRS`, '#fffbef');
      return;
    }

    if (this.wave === GATEKEEPER_WAVE) {
      this.spawnGatekeeper();
      this.sfx('boom', { vol: 0.7 });
      for (let i = 0; i < 2; i++) this.spawnQueue.push(i); // a little escort pressure alongside the boss
      this.spawnTimer = 700;
      this.showToast(`${N.enemies.gatekeeper.toUpperCase()} BARS THE WAY`, '#fffbef');
      return;
    }

    // Deeper sectors field more enemies, not just tougher ones - HP scaling alone made
    // Sector 5 feel like Sector 1 with bigger numbers.
    const count = 3 + this.wave + (this.sector - 1);
    for (let i = 0; i < count; i++) this.spawnQueue.push(i);
    this.spawnTimer = 0;
  }

  descend() {
    this.clearUI();
    this.sfx('descend');
    this.sector++;
    if (this.sector >= TEJAS_UNLOCK_SECTOR && !session.tejasUnlocked) {
      session.tejasUnlocked = true;
      saveSession();
      this.buildTejasUI();
      this.time.delayedCall(1600, () => this.showToast(`${N.supercharge.toUpperCase()} AWAKENS - kill to charge, then unleash`, '#ffd23c'));
    }
    this.wave = 0;
    this.progressNodes.forEach(node => { node.fillColor = 0x2a0f04; });
    this.state = 'playing';
    this.setFloor(this.sector, true);
    this.playMusic('combat');
    this.showSectorBanner(this.sector);
    this.nextWave();
  }

  // Every enemy carries one now, not just tanks and bosses - you cannot read a
  // fight you cannot see the state of. Bars scale with the enemy so a swarm of
  // Asura reads as chatter and a boss bar reads as a wall.
  addHpBar(enemy) {
    const big = !!enemy.isBoss;
    const w = big ? Math.max(58, enemy.radius * 2.4) : Math.max(22, enemy.radius * 1.9);
    const h = big ? 6 : 3.5;
    const y = enemy.y - enemy.radius - (big ? 18 : 13);
    enemy.hpBarW = w;
    enemy.hpBarH = h;
    enemy.hpBarBg = this.add.rectangle(enemy.x, y, w, h, FORGE.deep, 0.8)
      .setStrokeStyle(1, 0x000000, 0.45);
    enemy.hpBarFill = this.add.rectangle(enemy.x - w/2, y, w, h, FORGE.gold).setOrigin(0, 0.5);
  }

  // ---------- SATCHEL (run inventory) ----------
  // Deliberately does NOT pause: 2.7 says pickups never interrupt play, and a
  // pause-to-swap would turn every drop into a menu trip. The panel is translucent
  // and hugs the right edge so the arena stays readable while it is open - swapping
  // mid-fight is meant to cost you something.
  buildSatchelUI() {
    const b = this.arenaBounds;
    const tabW = 26, tabH = 84;
    const tx = b.right - tabW / 2 - 2, ty = b.centerY;

    this.satchelTab = this.add.rectangle(tx, ty, tabW, tabH, FORGE.panel, 0.92)
      .setStrokeStyle(1, FORGE.bronze, 0.8)
      .setInteractive({ useHandCursor: true });
    this.satchelTabIcon = this.add.text(tx, ty - 12, '◀', { resolution: RES, fontSize: '11px', color: '#ffd23c' }).setOrigin(0.5);
    this.satchelTabCount = this.add.text(tx, ty + 8, '0', { resolution: RES, fontSize: '13px', color: '#fffbef', fontStyle: 'bold' }).setOrigin(0.5);
    this.satchelTab.on('pointerdown', () => this.toggleSatchel());

    this.satchelItems = [];
    this.satchelPanel = null;
  }

  toggleSatchel() {
    this.invOpen = !this.invOpen;
    this.sfx('satchel');
    this.satchelTabIcon.setText(this.invOpen ? '▶' : '◀');
    this.refreshSatchel();
  }

  clearSatchelPanel() {
    if (this.satchelPanel) { this.satchelPanel.destroy(); this.satchelPanel = null; }
    (this.satchelItems || []).forEach(o => o.destroy());
    this.satchelItems = [];
  }

  refreshSatchel() {
    if (!this.satchelTab) return;
    this.satchelTabCount.setText(String(this.inventory.length));
    this.clearSatchelPanel();
    if (!this.invOpen) return;

    const b = this.arenaBounds;
    // Height follows the actual contents, not INV_MAX - an empty satchel should not
    // black out a third of the arena you are still fighting in.
    const rows = Math.max(1, this.inventory.length);
    const pw = 150, ph = Math.min(b.height - 20, 30 + rows * 34 + 12);
    const px = b.right - pw / 2 - 28, py = b.centerY;

    this.satchelPanel = this.add.rectangle(px, py, pw, ph, FORGE.deep, 0.93)
      .setStrokeStyle(1, FORGE.bronze, 0.85);

    const top = py - ph / 2;
    this.satchelItems.push(this.add.text(px, top + 14, N.satchel.toUpperCase(), { resolution: RES, fontSize: '10px', color: '#ffd23c', fontStyle: 'bold' }).setOrigin(0.5));

    if (this.inventory.length === 0) {
      this.satchelItems.push(this.add.text(px, top + 44, 'nothing swapped out yet', {
        resolution: RES, fontSize: '9px', color: '#8a7360', align: 'center', wordWrap: { width: pw - 20 }
      }).setOrigin(0.5));
      return;
    }

    this.inventory.forEach((item, i) => {
      const iy = top + 38 + i * 34;
      const row = this.add.rectangle(px, iy, pw - 14, 30, FORGE.panel, 0.9)
        .setStrokeStyle(1, FORGE.bronze, 0.4)
        .setInteractive({ useHandCursor: true });
      const icon = this.add.image(px - pw/2 + 20, iy, `icon_${item.effect || 'none'}`)
        .setDisplaySize(18, 18).setTint(RARITY[item.rarity].color);
      const name = this.add.text(px - pw/2 + 34, iy - 6, item.name, { resolution: RES, fontSize: '8px', color: '#fffbef' });
      const slot = this.add.text(px - pw/2 + 34, iy + 4, `${item.type} · tap to equip`, { resolution: RES, fontSize: '7px', color: '#8a7360' });
      row.on('pointerdown', () => this.equipFromSatchel(i));
      this.satchelItems.push(row, icon, name, slot);
    });
  }

  // Swap: the equipped item of the same slot goes back into the satchel, so nothing
  // is ever destroyed by a swap - only by the satchel overflowing.
  equipFromSatchel(index) {
    const item = this.inventory[index];
    if (!item) return;
    this.inventory.splice(index, 1);
    this.applyLoot(item, false);
    this.sfx('equip');
    this.refreshSatchel();
  }

  stashItem(item) {
    if (!item || !this.inventory) return;
    this.inventory.push(item);
    // Oldest falls out rather than blocking pickups - losing the thing you stopped
    // using ages ago is a kinder failure than being unable to pick anything up.
    if (this.inventory.length > INV_MAX) this.inventory.shift();
    this.refreshSatchel();
    this.hint('satchel', `Your old item went into the ${N.satchel} - the tab on the right edge. Tap it to swap back any time.`);
  }

  destroySatchelUI() {
    this.clearSatchelPanel();
    [this.satchelTab, this.satchelTabIcon, this.satchelTabCount].forEach(o => o && o.destroy());
    this.satchelTab = this.satchelTabIcon = this.satchelTabCount = null;
  }

  declutterLabels() {
    const shown = [];
    const boxOf = l => ({ x: l.x - l.width / 2, y: l.y - l.height / 2, w: l.width, h: l.height });
    const hit = (a, b) => a.x < b.x + b.w + 2 && b.x < a.x + a.w + 2 && a.y < b.y + b.h && b.y < a.y + a.h;
    // Bosses first so they always win; then nearest-to-player first, since that is the
    // enemy you most need to identify.
    const order = this.enemies.filter(e => e.nameLabel).sort((a, b) =>
      (b.isBoss - a.isBoss) ||
      (Math.hypot(a.x - this.player.x, a.y - this.player.y) - Math.hypot(b.x - this.player.x, b.y - this.player.y)));
    for (const e of order) {
      const box = boxOf(e.nameLabel);
      const clash = !e.isBoss && shown.some(b => hit(box, b));
      e.nameLabel.setVisible(!clash);
      if (!clash) shown.push(box);
    }
  }

  addNameLabel(enemy) {
    const big = !!enemy.isBoss;
    const role = enemy.isMega ? 'megaboss' : enemy.type;   // both sector bosses share a type
    const name = CHAR_LABELS[role] || '';
    if (!name) return;
    const label = enemy.isElite ? name.toUpperCase() : name;
    enemy.nameLabel = this.add.text(enemy.x, 0, label, {
      resolution: RES,
      fontSize: big ? '11px' : '8px',
      color: enemy.isElite ? '#ffd23c' : (big ? '#fffbef' : '#f0dcc0'),
      fontStyle: big ? 'bold' : 'normal',
      stroke: '#2a0800', strokeThickness: 2.5
    }).setOrigin(0.5).setAlpha(big ? 1 : 0.9);
  }

  // A second, separate bar above the HP bar showing how much shield is left. It sits
  // apart on purpose: while it has any fill the HP bar underneath is unreachable, and
  // two stacked bars say that far faster than a toast does.
  addShieldBar(enemy) {
    const w = Math.max(58, enemy.radius * 2.4);
    enemy.shieldBarW = w;
    enemy.shieldBarBg = this.add.rectangle(enemy.x, enemy.y - enemy.radius - 27, w, 5, FORGE.deep, 0.8)
      .setStrokeStyle(1, 0x000000, 0.45);
    enemy.shieldBarFill = this.add.rectangle(enemy.x - w/2, enemy.y - enemy.radius - 27, w, 5, 0x9fd8ff)
      .setOrigin(0, 0.5);
  }

  spawnGatekeeper() {
    const b = this.arenaBounds;
    const x = (b.x + b.right) / 2, y = b.y + 60;
    const weakPhase = Phaser.Utils.Array.GetRandom(PHASE_SEQUENCE);
    const hp = (220 + this.depth * 16) * sectorHpMult(this.sector);
    const enemy = {
      id: Phaser.Math.RND.uuid(),
      type: 'gatekeeper', isBoss: true, isSplit: false, isElite: false,
      x, y, hp, maxHp: hp,
      speed: 42, dmg: 0, radius: 26,
      hitCooldown: 0, goldDrop: 60 + this.depth * 4,
      isRanged: false,
      weakPhase
    };
    this.armBoss(enemy, 'gatekeeper');
    this.enemies.push(enemy);
    enemy.char = CHARS.gatekeeper;
    enemy.facing = 'front';
    const spr = this.add.image(x, y, `${enemy.char}-front`).setDisplaySize(enemy.radius * 2.8, enemy.radius * 2.8);
    // The weak-phase core sits UNDER the sprite as a glow pool, so Dwarapal's
    // silhouette stays readable while the colour tell is still unmistakable.
    const core = this.add.circle(x, y + enemy.radius * 0.55, 14, PHASE_DEFS[weakPhase].color, 0.85);
    core.setDepth(spr.depth - 1);
    this.tweens.add({ targets: core, alpha: 0.45, duration: 500, yoyo: true, repeat: -1 });
    this.enemySprites.set(enemy.id, spr);
    this.enemyCores.set(enemy.id, core);
    this.addHpBar(enemy);
    this.addNameLabel(enemy);
    this.hint('core', `The glowing core at ${N.enemies.gatekeeper}'s feet is the weak spot: full damage only while the phase bar matches that colour.`);
    return enemy;
  }

  spawnSectorBoss() {
    const isMega = this.sector === MEGA_BOSS_SECTOR;
    const b = this.arenaBounds;
    const x = (b.x + b.right) / 2, y = b.y + 70;
    const hp = (420 + this.depth * 26) * sectorHpMult(this.sector);
    const weakPhase = Phaser.Utils.Array.GetRandom(PHASE_SEQUENCE);
    const enemy = {
      id: Phaser.Math.RND.uuid(),
      type: 'sectorboss', isBoss: true, isSectorBoss: true, isMega: !!isMega,
      x, y, hp, maxHp: hp,
      speed: 34, dmg: 0, radius: isMega ? 38 : 32,
      hitCooldown: 0, goldDrop: isMega ? 260 : 130 + this.depth * 3,
      isRanged: false,
      weakPhase,
      bossPhase: isMega ? 'timing' : 'shielded',
      shieldOn: !isMega,
      keyAddIds: []
    };
    this.armBoss(enemy, isMega ? 'megaboss' : 'sectorboss');
    this.enemies.push(enemy);

    enemy.char = isMega ? CHARS.megaboss : CHARS.sectorboss;
    enemy.facing = 'front';
    const spr = this.add.image(x, y, `${enemy.char}-front`).setDisplaySize(enemy.radius * 2.8, enemy.radius * 2.8);
    this.enemySprites.set(enemy.id, spr);
    const outerRing = this.add.circle(x, y, enemy.radius + 10, 0x000000, 0).setStrokeStyle(2, isMega ? 0xc23cff : FORGE.gold, 0.5);
    this.enemyRings.set(enemy.id, outerRing);
    this.addHpBar(enemy);
    this.addNameLabel(enemy);

    if (isMega) {
      enemy.orbiters = [ this.add.circle(x, y, 4, 0xffd23c), this.add.circle(x, y, 4, 0xffd23c) ];
    }

    if (enemy.bossPhase === 'timing') {
      const core = this.add.circle(x, y + enemy.radius * 0.55, 16, PHASE_DEFS[weakPhase].color, 0.85);
      core.setDepth(spr.depth - 1);
      this.tweens.add({ targets: core, alpha: 0.45, duration: 500, yoyo: true, repeat: -1 });
      this.enemyCores.set(enemy.id, core);
    } else {
      this.spawnShieldAdds(enemy);
    }
    return enemy;
  }

  spawnShieldAdds(boss) {
    boss.keyAddIds = [];
    for (let i = 0; i < 3; i++) {
      const angle = (i / 3) * Math.PI * 2;
      const cx = Phaser.Math.Clamp(boss.x + Math.cos(angle) * 60, this.arenaBounds.x+16, this.arenaBounds.right-16);
      const cy = Phaser.Math.Clamp(boss.y + Math.sin(angle) * 60, this.arenaBounds.y+16, this.arenaBounds.bottom-16);
      const add = this.spawnEnemyOfType('melee', cx, cy, this.depth, false);
      add.isKeyAdd = true;
      add.ownerBossId = boss.id;
      boss.keyAddIds.push(add.id);
      const spr = this.enemySprites.get(add.id);
      // Character sprites are Images now, so the old gold outline is a gold wash -
      // same read ("this one is an anchor, kill it"), and it survives any art swap.
      if (spr) spr.setTint(0xffd23c);
    }
    // Shield: a breathing inner dome plus two counter-rotating rings. The old flat
    // circle gave no sense that it was holding anything back.
    const r = boss.radius + 8;
    const dome = this.add.circle(boss.x, boss.y, r, 0x9fd8ff, 0.16);
    const ringA = this.add.circle(boss.x, boss.y, r + 3, 0x000000, 0).setStrokeStyle(2, 0x9fd8ff, 0.75);
    const ringB = this.add.circle(boss.x, boss.y, r + 9, 0x000000, 0).setStrokeStyle(1.5, FORGE.cool, 0.45);

    this.tweens.add({ targets: dome, scale: 1.09, alpha: 0.28, duration: 780,
                      yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.tweens.add({ targets: ringA, angle: 360, duration: 6000, repeat: -1 });
    this.tweens.add({ targets: ringB, angle: -360, duration: 9000, repeat: -1 });

    boss.shieldParts = [dome, ringA, ringB];
    boss.shieldMax = boss.keyAddIds.length;
    this.enemyShields.set(boss.id, dome);   // kept for the existing pulse-on-hit path
    this.addShieldBar(boss);
    this.time.delayedCall(900, () => this.showToast('DESTROY THE ANCHORS', '#9fd8ff'));
    this.hint('shield', `Shielded - no damage gets through. Kill the gold-glowing ${N.enemies.melee} anchoring it and the shield breaks.`);
  }

  transitionMegaBossToShield(boss) {
    if (this.enemyCores.has(boss.id)) { this.enemyCores.get(boss.id).destroy(); this.enemyCores.delete(boss.id); }
    boss.bossPhase = 'shielded';
    boss.shieldOn = true;
    this.showToast(`${N.enemies.megaboss.toUpperCase()} COILS - DESTROY THE ANCHORS`, '#9fd8ff');
    this.sfx('toll', { rate: 1.3 });
    this.spawnShieldAdds(boss);
  }

  spawnEnemy() {
    const type = pickEnemyType(this.depth);
    const edge = Phaser.Math.Between(0,3);
    const b = this.arenaBounds;
    let x,y;
    if (edge===0) { x = Phaser.Math.Between(b.x, b.right); y = b.y; }
    else if (edge===1) { x = Phaser.Math.Between(b.x, b.right); y = b.bottom; }
    else if (edge===2) { x = b.x; y = Phaser.Math.Between(b.y, b.bottom); }
    else { x = b.right; y = Phaser.Math.Between(b.y, b.bottom); }

    this.spawnEnemyOfType(type, x, y, this.depth, false);
  }

  spawnEnemyOfType(type, x, y, wave, isSplit, isElite) {
    const def = ENEMY_TYPES[type];
    const eliteMult = isElite ? 2.6 : 1;
    const hp = (16 + wave * 7) * def.hpMult * (isSplit ? 0.4 : 1) * eliteMult * sectorHpMult(this.sector);
    const enemy = {
      id: Phaser.Math.RND.uuid(),
      type, isSplit: !!isSplit, isElite: !!isElite,
      x, y, hp, maxHp: hp,
      speed: (62 + wave * 5) * def.speedMult * (isSplit ? 1.15 : 1),
      dmg: (8 + wave * 1.4) * def.dmgMult * (isElite ? 1.5 : 1) * sectorDmgMult(this.sector),
      radius: (isSplit ? Math.max(7, def.radius - 4) : def.radius) + (isElite ? 6 : 0),
      hitCooldown: 0,
      goldDrop: Math.ceil((4 + wave) * (isSplit ? 0.35 : 1) * (isElite ? 4 : 1)),
      isRanged: !!def.isRanged,
      preferredRange: def.preferredRange || 0,
      fireTimer: def.fireInterval ? Phaser.Math.Between(300, def.fireInterval) : 0,
      fireInterval: def.fireInterval || 0,
      projSpeed: def.projSpeed || 0,
      projDmg: def.projDmgMult ? (8 + wave * 1.4) * def.projDmgMult * sectorDmgMult(this.sector) : 0,
      splitsOnDeath: !!def.splitsOnDeath && !isSplit
    };
    this.enemies.push(enemy);
    // Characters are now visually distinct by design (goblin / chieftain / brute / rogue),
    // so type no longer needs a tint to be readable - and tinting detailed art just
    // muddies it. Elites keep a gold wash because that IS a state, not an identity.
    enemy.char = CHARS[type];
    enemy.facing = 'front';
    const spr = this.add.image(x, y, `${enemy.char}-front`)
      .setDisplaySize(enemy.radius * 2.8, enemy.radius * 2.8);
    if (isElite) spr.setTint(0xffd23c);
    this.enemySprites.set(enemy.id, spr);
    this.addHpBar(enemy);
    this.addNameLabel(enemy);
    if (type === 'ranged') this.hint('ranged', `${N.enemies.ranged} shoot bolts from range. Keep moving sideways to dodge them.`);
    return enemy;
  }

  spawnElite() {
    const b = this.arenaBounds;
    const edge = Phaser.Math.Between(0,3);
    let x,y;
    if (edge===0) { x = Phaser.Math.Between(b.x, b.right); y = b.y; }
    else if (edge===1) { x = Phaser.Math.Between(b.x, b.right); y = b.bottom; }
    else if (edge===2) { x = b.x; y = Phaser.Math.Between(b.y, b.bottom); }
    else { x = b.right; y = Phaser.Math.Between(b.y, b.bottom); }
    this.spawnEnemyOfType('tank', x, y, this.depth, false, true);
  }

  // ---------- COMBAT ----------
  // Centralizes all damage TO the player so Aegis (shield block) applies consistently everywhere,
  // regardless of whether the source is contact, a boss slam, or a projectile.
  // kind: 'melee' | 'ranged' | 'slam'. source: the enemy that struck, when there is one.
  damagePlayer(amount, source, kind) {
    // Brief invulnerability after a melee/ranged hit. Without it five Asura touching you
    // landed five hits in the same instant - a one-frame death that reads as unfair, not
    // hard. Slams are exempt: they are telegraphed, so standing in one should always cost.
    if (kind !== 'slam' && this.player.iframes > 0) return false;
    if (this.player.shieldCharge > 0) {
      this.player.shieldCharge--;
      this.showToast(`${TRINKET_EFFECTS.aegis.label.toUpperCase()} BLOCKED`, '#4dd0ff');
      this.sfx('kavach');
      this.impactBurst(this.player.x, this.player.y, 0x9fd8ff);
      return false;
    }
    this.player.hp -= amount;
    if (kind !== 'slam') this.player.iframes = IFRAMES_MS;
    // The existing hit flicker now lasts exactly as long as the invulnerability, so the
    // player can read "I'm safe for a moment" off Kiran himself.
    this.player.flashTimer = Math.max(150, kind !== 'slam' ? IFRAMES_MS : 0);
    this.hitFeedback(amount, source, kind);
    if (this.player.hp > 0 && this.player.hp < this.player.maxHp * 0.3) {
      this.hint('lowhp', 'Low HP! Keep your distance. Beating a sector boss restores 35% of your health.');
    }
    if (this.player.hp <= 0) {
      this.player.hp = 0;
      this.endRun(false);
      return true;
    }
    return false;
  }

  killEnemy(enemy) {
    const spr = this.enemySprites.get(enemy.id);
    if (spr) spr.destroy();
    this.enemySprites.delete(enemy.id);
    if (this.enemyCores.has(enemy.id)) { this.enemyCores.get(enemy.id).destroy(); this.enemyCores.delete(enemy.id); }
    if (this.enemyRings.has(enemy.id)) { this.enemyRings.get(enemy.id).destroy(); this.enemyRings.delete(enemy.id); }
    if (this.enemyShields.has(enemy.id)) { this.enemyShields.get(enemy.id).destroy(); this.enemyShields.delete(enemy.id); }
    if (enemy.hpBarBg) { enemy.hpBarBg.destroy(); enemy.hpBarFill.destroy(); }
    if (enemy.shieldBarBg) { enemy.shieldBarBg.destroy(); enemy.shieldBarFill.destroy(); }
    if (enemy.shieldParts) enemy.shieldParts.forEach(pt => pt.destroy());
    if (enemy.nameLabel) enemy.nameLabel.destroy();
    if (enemy.orbiters) enemy.orbiters.forEach(o => o.destroy());
    if (enemy.telegraphGfx) { enemy.telegraphGfx.destroy(); enemy.telegraphGfx = null; }
    this.enemies.splice(this.enemies.indexOf(enemy), 1);

    this.runGold += enemy.goldDrop;
    this.gainTejas(enemy);
    if (enemy.isMega) { this.sfx('boss-fall'); this.sfx('toll', { rate: 0.8 }); }
    else if (enemy.isSectorBoss) this.sfx('boss-fall');
    else if (enemy.isBoss) { this.sfx('gate-open'); this.sfx('boom', { vol: 0.6 }); }
    else this.sfx('enemy-die', { rate: enemy.type === 'tank' ? 0.75 : (enemy.isSplit ? 1.25 : 1) });

    // if this was a shield anchor, check whether its boss's shield should now break
    if (enemy.isKeyAdd && enemy.ownerBossId) {
      const boss = this.enemies.find(e => e.id === enemy.ownerBossId);
      if (boss) {
        boss.keyAddIds = boss.keyAddIds.filter(id => id !== enemy.id);
        if (boss.keyAddIds.length === 0 && boss.shieldOn) {
          boss.shieldOn = false;
          boss.bossPhase = 'active';
          // Blow the shield outward rather than snapping it off - the break is the
          // payoff for the anchor puzzle and deserves to be seen.
          (boss.shieldParts || []).forEach(part => {
            this.tweens.killTweensOf(part);
            this.tweens.add({ targets: part, scale: 1.7, alpha: 0, duration: 260,
                              ease: 'Cubic.easeOut', onComplete: () => part.destroy() });
          });
          boss.shieldParts = null;
          this.enemyShields.delete(boss.id);
          if (boss.shieldBarBg) {
            boss.shieldBarBg.destroy(); boss.shieldBarFill.destroy();
            boss.shieldBarBg = null; boss.shieldBarFill = null;
          }
          this.showToast('THE SHIELD BREAKS', '#2fbf71');
          this.sfx('shield-break');
        }
      }
    }

    if (enemy.splitsOnDeath) {
      for (let i = 0; i < 2; i++) {
        const ox = enemy.x + Phaser.Math.Between(-18, 18);
        const oy = enemy.y + Phaser.Math.Between(-18, 18);
        this.spawnEnemyOfType('melee', ox, oy, this.depth, true);
      }
    }

    // Sector/Mega Boss defeat: skip normal wave-clear flow entirely, trigger the Extract/Descend choice instead
    if (enemy.isSectorBoss) {
      // Beating the sector boss restores part of your health. HP otherwise carries over,
      // and the bot showed players arriving at Sector 2 on 19-45% HP - nobody presses
      // Descend on 20% HP, which is the exact decision 1.6 depends on.
      const heal = Math.round(this.player.maxHp * SECTOR_CLEAR_HEAL);
      const before = this.player.hp;
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + heal);
      const gained = Math.round(this.player.hp - before);
      if (gained > 0 && settings.dmgNumbers) {
        const n = this.add.text(this.player.x, this.player.y - 30, `+${gained}`, { resolution: RES, fontSize: '15px',
          color: '#5fe08a', fontStyle: 'bold', stroke: '#2a0800', strokeThickness: 3 }).setOrigin(0.5).setDepth(40);
        this.tweens.add({ targets: n, y: n.y - 30, alpha: 0, duration: 1100, onComplete: () => n.destroy() });
      }
      this.spawnLootPickup(enemy.x, enemy.y, 'epic');
      this.spawnLootPickup(enemy.x + 24, enemy.y, 'epic');
      this.showToast(`${N.enemies[enemy.isMega ? 'megaboss' : 'sectorboss'].toUpperCase()} FALLS`, '#2fbf71');
      this.time.delayedCall(1000, () => { if (this.state === 'playing') this.showSectorClearChoice(enemy.isMega); });
      return;
    }

    const waveJustCleared = this.enemies.length === 0 && this.spawnQueue.length === 0;

    if (enemy.isBoss) {
      this.spawnLootPickup(enemy.x, enemy.y, 'epic');
      this.showToast('THE GATE OPENS', '#2fbf71');
    } else if (enemy.isElite) {
      this.spawnLootPickup(enemy.x, enemy.y, 'epic');
    } else if (waveJustCleared || Phaser.Math.Between(0,100) < 18) {
      this.spawnLootPickup(enemy.x, enemy.y);
    }
    if (waveJustCleared) this.afterWaveClear();
  }

  spawnLootPickup(x, y, forceRarity = null) {
    const isWeapon = Phaser.Math.Between(0,1) === 0;
    const phaseBoost = (PHASE_DEFS[this.phase] && PHASE_DEFS[this.phase].lootBoost) || 0;
    // ~25% of non-forced drops are Unidentified - you don't know what you're getting until you grab it
    const isMystery = !forceRarity && Phaser.Math.Between(0,100) < 25;
    const rarity = forceRarity || rollRarity(phaseBoost + (isMystery ? 10 : 0));
    const r = RARITY[rarity];

    let item;
    if (isWeapon) {
      // higher rarity = chance at extra simultaneous shots (Contra-style spread), not just bigger numbers
      let shots = 1;
      if (rarity === 'rare') shots = Phaser.Math.Between(0,100) < 50 ? 2 : 1;
      if (rarity === 'epic') shots = Phaser.Math.Between(2,3);

      const effectKey = pickWeaponEffect(this.sector);
      // Multi-shot is already shown as xN in the HUD, so it stays out of the name.
      item = {
        type: 'weapon', rarity, shots, effect: effectKey,
        name: `${r.label} ${WEAPON_EFFECTS[effectKey].label}`,
        dmg: 10 * r.mult * (1 + session.powerLevel*0.08),
        range: 130 + (r.mult-1)*20,
        atkSpeed: Math.max(180, 500 - (r.mult-1)*90),
        lifestealPct: effectKey === 'vampiric' ? 0.10 * r.mult : 0,
        poisonDmg: effectKey === 'venom' ? 3 * r.mult : 0,
        chainPct: effectKey === 'chain' ? Math.min(0.8, 0.4 * r.mult) : 0,
        executeBonusMult: effectKey === 'executioner' ? (rarity === 'common' ? 1.5 : rarity === 'rare' ? 2 : 2.5) : 1
      };
    } else {
      const effectKey = pickTrinketEffect(this.sector);
      item = {
        type: 'trinket', rarity, effect: effectKey,
        name: `${r.label} ${TRINKET_EFFECTS[effectKey].label}`,
        hpBonus: effectKey === 'vitality' ? 20 * r.mult : 0,
        rechargeMs: effectKey === 'aegis' ? Math.round(10000 / r.mult) : 0,
        reflectPct: effectKey === 'thorns' ? Math.min(0.6, 0.2 * r.mult) : 0,
        speedBonus: effectKey === 'swift' ? Math.round(25 * r.mult) : 0,
        regenPerSec: effectKey === 'regen' ? +(1.5 * r.mult).toFixed(2) : 0
      };
    }

    const px = Phaser.Math.Clamp(x, this.arenaBounds.x+16, this.arenaBounds.right-16);
    const py = Phaser.Math.Clamp(y, this.arenaBounds.y+16, this.arenaBounds.bottom-16);

    const dispColor = isMystery ? MYSTERY_COLOR : r.color;
    // Icon tells you WHAT dropped, tint tells you how good it is. Unidentified drops
    // deliberately show the same blank sigil regardless of contents - that ambiguity
    // is the whole incentive to risk walking over one.
    const iconKey = isMystery ? 'mystery' : (item.effect || 'none');
    const sprite = this.add.image(px, py, `icon_${iconKey}`)
      .setDisplaySize(19, 19)
      .setTint(dispColor);
    this.tweens.add({ targets: sprite, y: py-6, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    if (isMystery) {
      this.tweens.add({ targets: sprite, alpha: 0.45, duration: 350, yoyo: true, repeat: -1 });
    }
    const label = this.add.text(px, py-20, isMystery ? '???' : item.name, { resolution: RES, fontSize: '9px', color: isMystery ? '#d2b8ff' : '#fffbef', stroke: '#2a0800', strokeThickness: 2.5 }).setOrigin(0.5);
    { const b = this.arenaBounds, half = label.width / 2;
      label.x = Phaser.Math.Clamp(px, b.x + half + 4, b.right - half - 4); }   // never over the border

    this.pickups.push({ x: px, y: py, item, sprite, label, isMystery });
    if (isMystery) this.hint('mystery', "Violet ??? is unidentified - you won't know what it is until you grab it. It usually pays.");
    else this.hint('loot', 'Loot! Walk over it to equip. Copper, then silver, then gold: finer metal, stronger item.');
  }

  showToast(msg, color) {
    const t = this.add.text(W/2, HUD_H + 20, msg, { resolution: RES, fontSize: '14px', color, fontStyle: 'bold',
      stroke: '#2a0800', strokeThickness: 4 }).setOrigin(0.5).setAlpha(0).setDepth(45);
    this.tweens.add({
      targets: t, alpha: 1, y: HUD_H + 8, duration: 200, yoyo: true, hold: 700,
      onComplete: () => t.destroy()
    });
  }

  applyLoot(item, isMystery) {
    const tag = isMystery ? 'Mystery Revealed: ' : '';
    if (item.type === 'weapon') {
      // The outgoing weapon goes to the satchel rather than being lost.
      if (this.player.weapon) this.stashItem(this.player.weapon);
      this.player.weapon = item;
      this.showToast(`${tag}Equipped: ${item.name}`, isMystery ? '#ffd23c' : '#4dd0ff');
    } else {
      const oldHpBonus = (this.player.trinket && this.player.trinket.hpBonus) || 0;
      if (this.player.trinket) this.stashItem(this.player.trinket);
      this.player.trinket = item;
      this.player.maxHp += (item.hpBonus - oldHpBonus);
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + (item.hpBonus - oldHpBonus));
      this.player.shieldCharge = 0;
      this.player.shieldRechargeTimer = item.effect === 'aegis' ? item.rechargeMs : 0;
      this.showToast(`${tag}Equipped: ${item.name}`, isMystery ? '#ffd23c' : '#2fbf71');
    }
  }

  afterWaveClear() {
    this.runGold += 15 + this.depth * 4;
    this.sfx('wave-clear');
    this.time.delayedCall(400, () => { if (this.state === 'playing') this.nextWave(); });
  }

  showSectorClearChoice(isMega) {
    this.state = 'sectorChoice';
    this.clearUI();
    this.playMusic('hub');   // the decision is a breath between fights
    this.uiObjects.push(this.add.rectangle(W/2, H/2, W-50, 300, FORGE.deep, 0.97).setStrokeStyle(2, 0x2fbf71));
    this.uiObjects.push(this.add.text(W/2, H/2-115, isMega ? `${N.enemies.megaboss.toUpperCase()} FALLS` : 'SECTOR CLEARED', { resolution: RES, fontSize: '19px', color: '#2fbf71', fontStyle: 'bold' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-80, `${sectorTitle(this.sector)} · Sector ${this.sector} complete`, { resolution: RES, fontSize: '13px', color: '#fffbef' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-55, `${N.currency} carried: ${this.runGold}`, { resolution: RES, fontSize: '13px', color: '#ffd23c' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-15,
      'Extract now and bank all of it,\nor descend for tougher fights and\nbetter loot. Fall, and half is lost.',
      { resolution: RES, fontSize: '12px', color: '#c8a96e', align: 'center', lineSpacing: 4 }).setOrigin(0.5));

    this.makeButton(W/2, H/2+65, 230, 46, 'Extract — Bank & End Run', BTN.quiet, () => this.endRun(true));
    this.makeButton(W/2, H/2+120, 230, 46, `Descend to Sector ${this.sector+1}`, BTN.primary, () => this.descend(), { stroke: FORGE.gold });
  }

  // ---------- END OF RUN ----------
  endRun(victory, abandoned) {
    this.state = 'summary';
    this.clearHints();
    this.clearBanner();
    this.showPauseButton(false);
    if (victory) this.sfx('coins'); else this.sfx('toll', { rate: 0.75 });
    this.playMusic('hub');
    const banked = victory ? this.runGold : Math.floor(this.runGold * DEATH_KEEP);
    session.metaGold += banked;
    if (this.sector > (session.bestSector || 0)) session.bestSector = this.sector;
    saveSession();

    this.clearUI();
    this.uiObjects.push(this.add.rectangle(W/2, H/2, W-50, 280, FORGE.deep, 0.97).setStrokeStyle(2, victory ? 0x2fbf71 : 0xff5c5c));
    this.uiObjects.push(this.add.text(W/2, H/2-100, victory ? 'EXTRACTED SAFELY' : (abandoned ? 'RUN ABANDONED' : 'YOU FELL'), { resolution: RES, fontSize: '24px', color: victory ? '#2fbf71' : '#ff5c5c', fontStyle: 'bold' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-58, `Sector reached: ${this.sector}`, { resolution: RES, fontSize: '15px', color: '#fffbef' }).setOrigin(0.5));
    if (victory) {
      this.uiObjects.push(this.add.text(W/2, H/2-28, `${N.currency} banked: ${banked}`, { resolution: RES, fontSize: '15px', color: '#ffd23c' }).setOrigin(0.5));
    } else {
      this.uiObjects.push(this.add.text(W/2, H/2-32, `${N.currency} gathered: ${this.runGold}`, { resolution: RES, fontSize: '15px', color: '#ffd23c' }).setOrigin(0.5));
      this.uiObjects.push(this.add.text(W/2, H/2-10, abandoned ? `Half is forfeit. You keep ${banked}.` : `Half is lost in the fall. You keep ${banked}.`, { resolution: RES, fontSize: '12px', color: '#ff9a80' }).setOrigin(0.5));
    }
    this.uiObjects.push(this.add.text(W/2, H/2+20, `Treasury: ${session.metaGold} ${N.currency}`, { resolution: RES, fontSize: '13px', color: '#c8a96e' }).setOrigin(0.5));

    this.makeButton(W/2, H/2+80, 200, 48, 'Continue to Hub', BTN.primary, () => {
      // clean up run visuals
      if (this.playerSprite) { this.playerSprite.destroy(); this.playerSprite = null; }
      if (this.playerRing) this.playerRing.destroy();
      if (this.hpBarBg) this.hpBarBg.destroy();
      if (this.hpBarFill) this.hpBarFill.destroy();
      if (this.phaseTint) this.phaseTint.destroy();
      if (this.phaseBarBg) this.phaseBarBg.destroy();
      if (this.phaseBarFill) this.phaseBarFill.destroy();
      if (this.phaseBarLabel) this.phaseBarLabel.destroy();
      if (this.progressLine) this.progressLine.destroy();
      if (this.progressNodes) this.progressNodes.forEach(n => n.destroy());
      if (this.progressMarker) this.progressMarker.destroy();
      if (this.sectorLabel) this.sectorLabel.destroy();
      if (this.weaponText) this.weaponText.setText('');
      this.destroySatchelUI();
      this.destroyTejasUI();
      if (this.attackFx) { this.attackFx.destroy(); this.attackFx = null; }   // was leaking one per run
      // Cancel every timer the run scheduled. Without this a callback queued in the
      // last moments of a run (e.g. the 80ms beam clear) fired AFTER cleanup and hit a
      // destroyed object - found by tools/playtest-bot.js.
      this.time.removeAllEvents();
      this.enemySprites.forEach(s => s.destroy());
      if (this.enemyCores) this.enemyCores.forEach(c => c.destroy());
      if (this.enemyRings) this.enemyRings.forEach(r => r.destroy());
      if (this.enemyShields) this.enemyShields.forEach(s => s.destroy());
      if (this.enemies) this.enemies.forEach(e => {
        if (e.telegraphGfx) e.telegraphGfx.destroy();
        if (e.orbiters) e.orbiters.forEach(o => o.destroy());
        if (e.hpBarBg) { e.hpBarBg.destroy(); e.hpBarFill.destroy(); }
        if (e.shieldBarBg) { e.shieldBarBg.destroy(); e.shieldBarFill.destroy(); }
        if (e.shieldParts) e.shieldParts.forEach(pt => pt.destroy());
        if (e.nameLabel) e.nameLabel.destroy();
      });
      this.goldPickups.forEach(g => g.sprite && g.sprite.destroy());
      if (this.projectiles) this.projectiles.forEach(p => { if (p.sprite) p.sprite.destroy(); if (p.halo) p.halo.destroy(); });
      if (this.pickups) this.pickups.forEach(pk => { pk.sprite.destroy(); pk.label.destroy(); });
      this.showHub();
    });
    // The end of a run is when a player has something to say.
    this.makeButton(W/2, H/2+120, 150, 24, 'Send feedback', BTN.off, () => Feedback.open(), { size: 11, color: '#c8a96e' });
  }

  // ---------- MAIN LOOP ----------
  update(time, delta) {
    Music.tick(delta);
    if (this.menu) this.drawWell(time);
    if (this.state !== 'playing') return;
    const dt = delta / 1000;

    if (this.tejasBtn) {
      if (this.tejasKeys && (Phaser.Input.Keyboard.JustDown(this.tejasKeys.SPACE) ||
                             Phaser.Input.Keyboard.JustDown(this.tejasKeys.E))) this.activateTejas();
      this.updateTejas(delta, dt);
      if (this.state !== 'playing') return;   // a Tejas pulse can end the sector
    }

    // --- Cosmic Cycle: advance phase timer, trigger Convergence on schedule ---
    if (!this.inConvergence) {
      this.convergenceCountdown -= delta;
      this.phaseTimeLeft -= delta;
      if (this.convergenceCountdown <= 0) {
        this.savedPhase = this.phase;
        this.savedPhaseTimeLeft = this.phaseTimeLeft;
        this.inConvergence = true;
        this.phase = 'convergence';
        this.phaseTimeLeft = PHASE_DEFS.convergence.duration;
        this.convergenceCountdown = CONVERGENCE_INTERVAL;
        this.showToast(`${PHASE_DEFS.convergence.label} - an elite approaches`, '#fffbef');
        this.spawnElite();
        this.sfx('tejas-bell', { rate: 0.7 });
        this.refreshMusic();
        this.hint('pralaya', `${N.phases.convergence}! An elite ${N.enemies.tank} joins the fight - and the best loot drops now.`);
      } else if (this.phaseTimeLeft <= 0) {
        const idx = (PHASE_SEQUENCE.indexOf(this.phase) + 1) % PHASE_SEQUENCE.length;
        this.phase = PHASE_SEQUENCE[idx];
        this.phaseTimeLeft = PHASE_DEFS[this.phase].duration;
        this.showToast(`${PHASE_DEFS[this.phase].label} begins`, '#' + PHASE_DEFS[this.phase].color.toString(16).padStart(6,'0'));
        this.sfx('phase');
        this.refreshMusic();
