<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loot Chase - v0.1 POC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; background: #2a0800;
    height: 100%; width: 100%; overflow: hidden;
    font-family: 'Trebuchet MS', sans-serif;
  }
  #game-container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #game-container canvas { box-shadow: 0 0 40px rgba(120,90,255,0.25); border-radius: 8px; }
</style>
</head>
<body>
<div id="game-container"></div>
<script>

const W = 400, H = 700;

// Backing-store multiplier for high-DPI screens. The game still thinks in 400x700
// world units - RES only raises the number of real pixels those units are drawn
// into, and the main camera zooms back in by the same factor so no coordinate in
// this file has to change. Without it a 400px buffer gets stretched across ~1179
// device pixels on a modern iPhone, which is the softness you can see.
// Clamped to 3: beyond that the buffer cost stops buying visible sharpness.
const RES = Math.min(3, Math.max(2, Math.round(window.devicePixelRatio || 1)));
const MARGIN = 30, HUD_H = 76;
const GATEKEEPER_WAVE = 3;
const MEGA_BOSS_SECTOR = 3;

// Light narrative frame - secular, cosmic/sci-fi, delivered via short banners, never blocking gameplay
const SECTOR_LORE = {
  1: { name: 'THE FRACTURED APPROACH', sub: "Cracks in the Cycle spill gold and monsters alike." },
  2: { name: 'THE CHURNING DEPTHS',    sub: "The Cycle turns faster the deeper you go." },
  3: { name: 'THE CONVERGENCE CORE',   sub: "Something is destabilizing the Cycle itself." }
};
function sectorTitle(n) { return SECTOR_LORE[n] ? SECTOR_LORE[n].name : `THE ENDLESS DESCENT — SECTOR ${n}`; }
function sectorSub(n) { return SECTOR_LORE[n] ? SECTOR_LORE[n].sub : 'Deeper than any map remembers.'; }

// Persists across page reloads via localStorage (falls back to in-memory if unavailable, e.g. private browsing)
const SAVE_KEY = 'loot-chase-session-v1';
const session = {
  metaGold: 0,
  vitalityLevel: 0,   // +10% max HP per level
  powerLevel: 0,       // +8% weapon dmg per level
  bestSector: 0
};

function loadSession() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved) Object.assign(session, saved);
  } catch (e) { /* localStorage unavailable — session stays in-memory only */ }
}

function saveSession() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(session)); } catch (e) { /* ignore */ }
}

loadSession();

const RARITY = {
  common: { mult: 1.0,  color: 0xaeb4c2, label: 'Common' },
  rare:   { mult: 1.5,  color: 0x4dd0ff, label: 'Rare' },
  epic:   { mult: 2.3,  color: 0xc77dff, label: 'Epic' }
};

function rollRarity(boost = 0) {
  const r = Phaser.Math.Between(0,99) + boost;
  if (r < 58) return 'common';
  if (r < 90) return 'rare';
  return 'epic';
}

// Item identities, Dota-recipe inspired: each effect is a distinct mechanical identity, not just a bigger number.
// minSector gates when it starts appearing in drop pools - deeper sectors unlock stronger, more complex effects.
const WEAPON_EFFECTS = {
  none:        { label: '',            minSector: 1 },
  venom:       { label: 'Venom',       minSector: 1, desc: 'Poisons on hit' },
  vampiric:    { label: 'Vampiric',    minSector: 1, desc: 'Heals you on hit' },
  chain:       { label: 'Chain',       minSector: 2, desc: 'Jumps to a 2nd enemy' },
  executioner: { label: 'Executioner', minSector: 3, desc: 'Bonus vs low-HP enemies' }
};
const TRINKET_EFFECTS = {
  vitality: { label: 'Vitality', minSector: 1, desc: 'Max HP boost' },
  aegis:    { label: 'Aegis',    minSector: 1, desc: 'Periodic shield charge' },
  thorns:   { label: 'Thorns',   minSector: 2, desc: 'Reflects contact damage' },
  swift:    { label: 'Swift',    minSector: 2, desc: 'Movement speed boost' },
  regen:    { label: 'Regen',    minSector: 3, desc: 'Heals over time' }
};
function pickWeaponEffect(sector) {
  const pool = Object.keys(WEAPON_EFFECTS).filter(k => WEAPON_EFFECTS[k].minSector <= sector);
  return Phaser.Utils.Array.GetRandom(pool);
}
function pickTrinketEffect(sector) {
  const pool = Object.keys(TRINKET_EFFECTS).filter(k => TRINKET_EFFECTS[k].minSector <= sector);
  return Phaser.Utils.Array.GetRandom(pool);
}

// The Cosmic Cycle: a continuous, learnable timer independent of waves.
// Predictable on purpose - mastery comes from planning around it, not reacting blind.
// Object keys stay English so save data and existing logic keep working; only the
// player-facing label changes (requirements.md 2.12). Tints are warm now - a cool
// overlay on a forge arena fought the palette.
const PHASE_DEFS = {
  drift:    { label: 'SHANTI',  color: 0x4dd0ff, duration: 20000, enemyDmgMult: 1.0,  playerDmgMult: 1.0,  spawnRateMult: 1.0, lootBoost: 0,  tint: 0x1d4a5c, tintAlpha: 0.35 },
  surge:    { label: 'SHAKTI',  color: 0xff8c42, duration: 12000, enemyDmgMult: 1.0,  playerDmgMult: 1.0,  spawnRateMult: 0.65,lootBoost: 15, tint: 0x5c2a05, tintAlpha: 0.45 },
  eclipse:  { label: 'GRAHAN',  color: 0xc4331f, duration: 10000, enemyDmgMult: 1.3,  playerDmgMult: 1.3,  spawnRateMult: 1.0, lootBoost: 0,  tint: 0x4a0f08, tintAlpha: 0.55 },
  convergence: { label: 'PRALAYA', color: 0xfffbef, duration: 8000, enemyDmgMult: 1.0, playerDmgMult: 1.0, spawnRateMult: 1.0, lootBoost: 30, tint: 0x6b5a1a, tintAlpha: 0.4 }
};
const PHASE_SEQUENCE = ['drift', 'surge', 'eclipse'];
const CONVERGENCE_INTERVAL = 90000;

// Sanskrit roster (requirements.md 2.12). Each entry is a character folder in
// assets/chars/ with four facing frames: -front, -back, -left, -right.
// Art is CraftPix (commercial use, no attribution) - see assets/CREDITS.md.
const CHARS = {
  melee:    'asura',        // असुर  — cosmic dark being
  ranged:   'yaksha',       // यक्ष   — keeper of hidden treasure
  tank:     'mahish',       // महिष  — great force
  splitter: 'bheda',        // भेद   — division, splitting
  player:   'kiran',        // किरण  — ray of light
  gatekeeper:  'dwarapal',  // द्वारपाल — gate guardian
  sectorboss:  'nidhiraksha', // निधि-रक्षा — treasure guardian
  megaboss:    'kalachakra' // कालचक्र — wheel of time
};
const FACINGS = ['front', 'back', 'left', 'right'];
const INV_MAX = 8;   // satchel capacity; oldest falls out past this

// Shown above every enemy. These are the Sanskrit *type* names, not proper nouns -
// the point is that the player is reading "Asura", "Yaksha", "Mahish" constantly
// during a run, so the Indian identity lands through play rather than through a
// menu nobody opens. Devanagari is deliberately omitted here: at ~9px over a moving
// sprite it turns to mush, and it already carries the identity on the codex screen.
const CHAR_LABELS = {
  melee: 'Asura', ranged: 'Yaksha', tank: 'Mahish', splitter: 'Bheda',
  gatekeeper: 'Dwarapal', sectorboss: 'Nidhi-Raksha', megaboss: 'Kalachakra'
};

// "Cosmic Forge" palette, measured from concept/loot-chase-visual-forge-v2.html.
// Warm throughout: the direction was rejected twice for reading too dark.
const FORGE = {
  deep:   0x2a0800,  // furthest back
  bg:     0x3d1200,  // arena floor
  panel:  0x4a1a04,  // HUD chrome
  ember:  0xff6b1a,  // hot edge
  flame:  0xff8c42,  // forge orange
  gold:   0xffd23c,  // player-facing highlight, currency
  bronze: 0xc8a96e,  // tarnished trim
  cream:  0xfffbef,  // brightest
  cool:   0x4dd0ff   // the single cool accent (Shanti) - pops against everything
};

// Movement vector -> facing frame. Vertical wins ties so a diagonal runner
// still reads as advancing rather than flickering between two side frames.
function facingFor(dx, dy) {
  if (Math.abs(dy) >= Math.abs(dx)) return dy >= 0 ? 'front' : 'back';
  return dx >= 0 ? 'right' : 'left';
}

const ENEMY_TYPES = {
  melee:    { hpMult: 1.0, speedMult: 1.0, dmgMult: 1.0, radius: 12, color: 0xff5c5c },
  ranged:   { hpMult: 0.6, speedMult: 0.85, dmgMult: 0.0, radius: 10, color: 0xffa63c,
              isRanged: true, preferredRange: 175, fireInterval: 1500, projSpeed: 260, projDmgMult: 0.85 },
  tank:     { hpMult: 2.6, speedMult: 0.5, dmgMult: 1.7, radius: 19, color: 0x8a8a9c },
  splitter: { hpMult: 0.85, speedMult: 1.1, dmgMult: 0.85, radius: 11, color: 0xc77dff, splitsOnDeath: true }
};

// weighted pool of types unlocked per wave - depth ramps up as you go deeper
function pickEnemyType(wave) {
  const pool = [['melee', 100]];
  if (wave >= 2) pool.push(['ranged', 40]);
  if (wave >= 3) pool.push(['tank', 30]);
  if (wave >= 4) pool.push(['splitter', 30]);
  const total = pool.reduce((s,p) => s+p[1], 0);
  let r = Phaser.Math.Between(0, total-1);
  for (const [type, weight] of pool) {
    if (r < weight) return type;
    r -= weight;
  }
  return 'melee';
}

class LootScene extends Phaser.Scene {
  constructor() { super('LootScene'); }

  // Kenney "Space Shooter Remastered", CC0 — see assets/CREDITS.md for the file map.
  preload() {
    // 8 characters x 4 facings. Texture key is "<char>-<facing>", e.g. "asura-left".
    for (const name of Object.values(CHARS)) {
      for (const f of FACINGS) {
        this.load.image(`${name}-${f}`, `assets/chars/${name}-${f}.png`);
      }
    }
    this.load.image('bg_stars', 'assets/bg-stars.png');
  }

  create() {
    this.state = 'hub'; // hub -> playing -> loot -> playing... -> summary -> hub
    this.uiObjects = [];

    // Canvas is RES times larger than the world; zoom back in by RES so the visible
    // area is exactly 0..W, 0..H. Every coordinate below stays in world units.
    this.cameras.main.setZoom(RES).centerOn(W/2, H/2);
    this.makeLootIcons();

    this.add.rectangle(W/2, H/2, W, H, FORGE.deep);

    this.arenaBounds = new Phaser.Geom.Rectangle(MARGIN, HUD_H + MARGIN, W - MARGIN*2, H - HUD_H - MARGIN*2);

    const ab = this.arenaBounds;

    // Warm forge floor, plus a radial heat glow from the upper-middle. The flat fill
    // alone still read as "dark room" - the glow is what makes it a forge. Matches the
    // layered radial warmth in concept/loot-chase-visual-forge-v2.html.
    this.add.rectangle(ab.centerX, ab.centerY, ab.width, ab.height, FORGE.bg);
    const glowCx = ab.centerX, glowCy = ab.y + ab.height * 0.32;
    // Masked to the arena, or the wider rings would bleed over the HUD and the margins.
    const glowMask = this.make.graphics({ add: false });
    glowMask.fillStyle(0xffffff).fillRect(ab.x, ab.y, ab.width, ab.height);
    const mask = glowMask.createGeometryMask();
    for (const [rx, ry, colour, alpha] of [
      [ab.width * 1.10, ab.height * 0.55, FORGE.ember, 0.06],
      [ab.width * 0.75, ab.height * 0.38, FORGE.ember, 0.07],
      [ab.width * 0.46, ab.height * 0.23, FORGE.flame, 0.08],
      [ab.width * 0.22, ab.height * 0.11, FORGE.gold,  0.07]
    ]) {
      this.add.ellipse(glowCx, glowCy, rx * 2, ry * 2, colour, alpha).setMask(mask);
    }

    // The old starfield texture, tinted hot and held faint: it now reads as drifting
    // embers over the forge rather than stars in space.
    this.starfield = this.add.tileSprite(ab.centerX, ab.centerY, ab.width, ab.height, 'bg_stars')
      .setTint(FORGE.ember)
      .setAlpha(0.28);

    this.add.rectangle(ab.centerX, ab.centerY, ab.width, ab.height, 0x000000, 0)
      .setStrokeStyle(1, FORGE.bronze, 0.7);

    // HUD chrome is drawn after the arena so it always wins the depth fight.
    this.add.rectangle(W/2, HUD_H/2, W, HUD_H, FORGE.panel);
    this.hudText = this.add.text(14, 8, '', { resolution: RES, fontSize: '13px', color: '#e8e0ff' });
    this.weaponText = this.add.text(14, 60, '', { resolution: RES, fontSize: '11px', color: '#9a8fc2' });

    // input for movement (only acts while playing)
    this.pointerTarget = null;
    this.input.on('pointerdown', p => { if (this.state === 'playing') this.pointerTarget = { x: p.worldX, y: p.worldY }; });
    this.input.on('pointermove', p => { if (this.state === 'playing' && p.isDown) this.pointerTarget = { x: p.worldX, y: p.worldY }; });
    this.input.on('pointerup', () => { this.pointerTarget = null; });

    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys('W,A,S,D');

    this.showHub();
  }

  // ---------- ATTACK VISUALS ----------
  // Every weapon used to draw the same cyan line, so a Venom Blade and an Executioner
  // felt identical to use. Each effect now has its own beam shape and colour, which is
  // also free build feedback: you can see what you're holding without reading the HUD.
  drawWeaponBeam(x1, y1, x2, y2, effect) {
    const fx = this.attackFx;
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const len = Math.hypot(x2 - x1, y2 - y1);

    switch (effect) {
      case 'venom': {            // sickly, dripping - beads of poison along the path
        fx.lineStyle(2, 0x7fdd3c, 0.75);
        fx.lineBetween(x1, y1, x2, y2);
        fx.fillStyle(0x7fdd3c, 0.9);
        for (let t = 0.25; t < 1; t += 0.25) {
          const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
          fx.fillCircle(px, py + Math.sin(t * 9) * 3, 2.6);
        }
        break;
      }
      case 'vampiric': {         // crimson draw, thicker at the victim end
        fx.lineStyle(4, 0xc4331f, 0.55); fx.lineBetween(x1, y1, x2, y2);
        fx.lineStyle(1.5, 0xff8080, 0.95); fx.lineBetween(x1, y1, x2, y2);
        fx.fillStyle(0xff8080, 0.9); fx.fillCircle(x2, y2, 4);
        break;
      }
      case 'chain': {            // jagged arc rather than a straight line
        fx.lineStyle(2, 0x4dd0ff, 0.95);
        fx.beginPath(); fx.moveTo(x1, y1);
        const steps = Math.max(3, Math.round(len / 22));
        for (let i = 1; i < steps; i++) {
          const t = i / steps;
          const off = (i % 2 ? 1 : -1) * Phaser.Math.Between(4, 9);
          fx.lineTo(x1 + (x2-x1)*t + Math.cos(ang + Math.PI/2) * off,
                    y1 + (y2-y1)*t + Math.sin(ang + Math.PI/2) * off);
        }
        fx.lineTo(x2, y2); fx.strokePath();
        break;
      }
      case 'executioner': {      // heavy gold wedge - widens toward the target
        const n = ang + Math.PI/2;
        fx.fillStyle(FORGE.gold, 0.6);
        fx.beginPath();
        fx.moveTo(x1 + Math.cos(n)*1.5, y1 + Math.sin(n)*1.5);
        fx.lineTo(x2 + Math.cos(n)*7,   y2 + Math.sin(n)*7);
        fx.lineTo(x2 - Math.cos(n)*7,   y2 - Math.sin(n)*7);
        fx.lineTo(x1 - Math.cos(n)*1.5, y1 - Math.sin(n)*1.5);
        fx.closePath(); fx.fillPath();
        break;
      }
      default: {                 // plain weapon: clean, quick, unremarkable on purpose
        fx.lineStyle(2, FORGE.cool, 0.8);
        fx.lineBetween(x1, y1, x2, y2);
      }
    }
  }

  // Short-lived burst where a hit lands. Destroys itself, so it needs no bookkeeping
  // in the run-cleanup path.
  impactBurst(x, y, colour) {
    const ring = this.add.circle(x, y, 5, colour, 0.55);
    this.tweens.add({
      targets: ring, scale: 2.4, alpha: 0,
      duration: 180, ease: 'Cubic.easeOut',
      onComplete: () => ring.destroy()
    });
  }

  // ---------- LOOT ICONS ----------
  // Drawn once into textures at boot rather than shipped as files: they stay exactly
  // on-palette, cost nothing to download, and one texture serves every rarity because
  // the rarity colour is applied as a tint at pickup time.
  makeLootIcons() {
    const S = 32, C = S / 2;
    const g = this.make.graphics({ add: false });
    const ink = 0xfffbef;
    const def = (key, draw) => {
      g.clear();
      g.fillStyle(ink, 1); g.lineStyle(3, ink, 1);
      draw(g);
      g.generateTexture('icon_' + key, S, S);
    };

    // --- weapons ---
    def('none', g => {                      // plain blade
      g.fillTriangle(C, 3, C - 5, 14, C + 5, 14);
      g.fillRect(C - 4, 14, 8, 11);
      g.fillRect(C - 8, 24, 16, 4);
    });
    def('venom', g => {                     // droplet
      g.fillTriangle(C, 4, C - 8, 17, C + 8, 17);
      g.fillCircle(C, 19, 8);
    });
    def('vampiric', g => {                  // paired fangs
      g.fillTriangle(C - 7, 5, C - 1, 5, C - 4, 24);
      g.fillTriangle(C + 1, 5, C + 7, 5, C + 4, 24);
      g.fillRect(C - 9, 4, 18, 4);
    });
    def('chain', g => {                     // two interlocked links
      g.strokeCircle(C - 5, C, 7);
      g.strokeCircle(C + 5, C, 7);
    });
    def('executioner', g => {               // axe head
      g.fillRect(C - 2, 4, 4, 24);
      g.beginPath(); g.moveTo(C + 1, 6); g.lineTo(C + 13, 12);
      g.lineTo(C + 13, 20); g.lineTo(C + 1, 24); g.closePath(); g.fillPath();
    });

    // --- trinkets ---
    def('vitality', g => {                  // heart
      g.fillCircle(C - 5, 12, 6); g.fillCircle(C + 5, 12, 6);
      g.fillTriangle(C - 11, 14, C + 11, 14, C, 28);
    });
    def('aegis', g => {                     // shield
      g.beginPath(); g.moveTo(C, 3); g.lineTo(C + 11, 9); g.lineTo(C + 9, 21);
      g.lineTo(C, 29); g.lineTo(C - 9, 21); g.lineTo(C - 11, 9);
      g.closePath(); g.fillPath();
    });
    def('thorns', g => {                    // spiked ring
      g.strokeCircle(C, C, 7);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        g.lineBetween(C + Math.cos(a) * 8, C + Math.sin(a) * 8,
                      C + Math.cos(a) * 14, C + Math.sin(a) * 14);
      }
    });
    def('swift', g => {                     // stacked chevrons
      for (const dy of [0, 9]) {
        g.beginPath(); g.moveTo(C - 9, 8 + dy); g.lineTo(C, 15 + dy); g.lineTo(C + 9, 8 + dy);
        g.strokePath();
      }
    });
    def('regen', g => {                     // cross
      g.fillRect(C - 3, 6, 6, 20);
      g.fillRect(6, C - 3, 20, 6);
    });

    // --- unidentified ---
    def('mystery', g => {
      g.strokeCircle(C, C, 11);
      g.fillCircle(C, C, 3);
    });

    g.destroy();
  }

  // ---------- UI HELPERS ----------
  clearUI() {
    this.uiObjects.forEach(o => o.destroy());
    this.uiObjects = [];
  }

  makeButton(x, y, w, h, label, color, onClick) {
    const bg = this.add.rectangle(x, y, w, h, color).setStrokeStyle(2, 0xffffff, 0.25).setInteractive({ useHandCursor: true });
    const txt = this.add.text(x, y, label, { resolution: RES, fontSize: '16px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
    bg.on('pointerdown', onClick);
    this.uiObjects.push(bg, txt);
    return bg;
  }

  // ---------- HUB / SHOP ----------
  showHub() {
    this.clearUI();
    this.state = 'hub';
    this.hudText.setText('');

    this.uiObjects.push(this.add.text(W/2, 130, 'LOOT CHASE', { resolution: RES, fontSize: '30px', color: '#c77dff', fontStyle: 'bold' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, 165, 'auto-battle · collect loot · descend deeper', { resolution: RES, fontSize: '12px', color: '#9a8fc2' }).setOrigin(0.5));
    if (session.bestSector) {
      this.uiObjects.push(this.add.text(W/2, 185, `Best depth reached: Sector ${session.bestSector}`, { resolution: RES, fontSize: '11px', color: '#7a6fa0' }).setOrigin(0.5));
    }

    this.uiObjects.push(this.add.text(W/2, 230, `Hoard Gold: ${session.metaGold}`, { resolution: RES, fontSize: '18px', color: '#ffd23c', fontStyle: 'bold' }).setOrigin(0.5));

    const vitCost = 50 * (session.vitalityLevel + 1);
    const powCost = 60 * (session.powerLevel + 1);

    this.uiObjects.push(this.add.text(W/2, 290, `Vitality Lv.${session.vitalityLevel}  (+${session.vitalityLevel*10}% Max HP)`, { resolution: RES, fontSize: '13px', color: '#e8e0ff' }).setOrigin(0.5));
    this.makeButton(W/2, 325, 220, 40, `Upgrade — ${vitCost}g`, session.metaGold >= vitCost ? 0x3a2f66 : 0x241d40, () => {
      if (session.metaGold >= vitCost) { session.metaGold -= vitCost; session.vitalityLevel++; saveSession(); this.showHub(); }
    });

    this.uiObjects.push(this.add.text(W/2, 385, `Power Lv.${session.powerLevel}  (+${session.powerLevel*8}% Weapon Dmg)`, { resolution: RES, fontSize: '13px', color: '#e8e0ff' }).setOrigin(0.5));
    this.makeButton(W/2, 420, 220, 40, `Upgrade — ${powCost}g`, session.metaGold >= powCost ? 0x3a2f66 : 0x241d40, () => {
      if (session.metaGold >= powCost) { session.metaGold -= powCost; session.powerLevel++; saveSession(); this.showHub(); }
    });

    this.makeButton(W/2, 510, 200, 54, 'START RUN', 0x7c3fff, () => this.startRun());
    this.uiObjects.push(this.add.text(W/2, 556, 'Clear each sector, then extract or descend.', { resolution: RES, fontSize: '12px', color: '#7a6fa0' }).setOrigin(0.5));

    const locked = this.lockedPowerCount();
    this.makeButton(W/2, 606, 200, 38, 'POWERS', 0x5c2a05, () => this.showCodex());
    this.uiObjects.push(this.add.text(W/2, 640,
      locked > 0 ? `${locked} still locked — descend to find them` : 'all powers unlocked',
      { resolution: RES, fontSize: '11px', color: locked > 0 ? '#ffd23c' : '#7a6fa0' }).setOrigin(0.5));
  }

  // ---------- CODEX ----------
  // How many effects the player has not yet reached the depth to see drop. Surfaced on
  // the hub button because "3 still locked" is a far better reason to press Descend
  // than any amount of copy about replayability.
  lockedPowerCount() {
    const reached = session.bestSector || 1;
    return [...Object.entries(WEAPON_EFFECTS), ...Object.entries(TRINKET_EFFECTS)]
      .filter(([k, e]) => k !== 'none' && e.minSector > reached).length;
  }

  showCodex() {
    this.clearUI();
    this.state = 'hub';
    const reached = session.bestSector || 1;

    // Both sit fully inside the HUD panel (height HUD_H) rather than straddling its edge.
    this.uiObjects.push(this.add.text(W/2, 30, 'POWERS', { resolution: RES, fontSize: '22px', color: '#ffd23c', fontStyle: 'bold' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, 56, `found in the depths · best sector ${reached}`, { resolution: RES, fontSize: '11px', color: '#c8a96e' }).setOrigin(0.5));

    const row = (key, def, y, kind) => {
      const unlocked = def.minSector <= reached;
      const tint = unlocked ? (kind === 'weapon' ? 0xff8c42 : 0x4dd0ff) : 0x5a4535;
      const icon = this.add.image(44, y, `icon_${key}`).setDisplaySize(26, 26).setTint(tint);
      const name = this.add.text(70, y - 8, def.label,
        { resolution: RES, fontSize: '13px', color: unlocked ? '#fffbef' : '#7a6656', fontStyle: 'bold' });
      const desc = this.add.text(70, y + 6, unlocked ? def.desc : `Locked — reaches you in Sector ${def.minSector}`,
        { resolution: RES, fontSize: '10px', color: unlocked ? '#c8a96e' : '#6b5847' });
      this.uiObjects.push(icon, name, desc);
    };

    this.uiObjects.push(this.add.text(24, 108, 'WEAPONS', { resolution: RES, fontSize: '11px', color: '#ff8c42', fontStyle: 'bold' }));
    let y = 136;
    for (const [key, def] of Object.entries(WEAPON_EFFECTS)) {
      if (key === 'none') continue;          // the starting dagger is not a discovery
      row(key, def, y, 'weapon'); y += 40;
    }

    this.uiObjects.push(this.add.text(24, y + 4, 'TRINKETS', { resolution: RES, fontSize: '11px', color: '#4dd0ff', fontStyle: 'bold' }));
    y += 32;
    for (const [key, def] of Object.entries(TRINKET_EFFECTS)) { row(key, def, y, 'trinket'); y += 40; }

    this.uiObjects.push(this.add.text(W/2, y + 12,
      'Rarity scales how strong an effect is.\nAbout 1 in 4 drops is unidentified — riskier, better odds.',
      { resolution: RES, fontSize: '10px', color: '#8a7360', align: 'center' }).setOrigin(0.5));

    this.makeButton(W/2, H - 56, 160, 40, 'BACK', 0x5c2a05, () => this.showHub());
  }

  // ---------- RUN SETUP ----------
  startRun() {
    this.clearUI();
    this.state = 'playing';

    // Satchel: items swapped out during this run, so a pickup no longer destroys
    // whatever you were holding. Run-scoped by design - carrying loot between runs
    // would undermine the Extract/Descend decision (2.5).
    this.inventory = [];
    this.invOpen = false;

    // Cosmic Cycle state - continuous, learnable timer independent of waves
    this.phase = 'drift';
    this.phaseTimeLeft = PHASE_DEFS.drift.duration;
    this.convergenceCountdown = CONVERGENCE_INTERVAL;
    this.inConvergence = false;
    this.savedPhase = null;
    this.savedPhaseTimeLeft = null;

    // Sector/depth state - runs are no longer capped at one 5-wave block
    this.sector = 1;
    this.depth = 0;

    // mood tint over the arena that shifts with the current phase (procedural, no art needed)
    const arenaCy = HUD_H + (H-HUD_H)/2;
    this.phaseTint = this.add.rectangle(W/2, arenaCy, W - MARGIN*2, H - HUD_H - MARGIN*2, PHASE_DEFS.drift.tint, PHASE_DEFS.drift.tintAlpha);

    const baseMaxHP = 100 * (1 + session.vitalityLevel * 0.10);
    this.player = {
      x: W/2, y: HUD_H + (H-HUD_H)/2,
      maxHp: baseMaxHP, hp: baseMaxHP,
      speed: 200,
      flashTimer: 0,
      shieldCharge: 0,
      shieldRechargeTimer: 0,
      // `type` matters now that the satchel can hand this back to applyLoot: without
      // it the starting Dagger fell through to the trinket branch and equipped itself
      // into the wrong slot. Every dropped item already carries one.
      weapon: { type: 'weapon', name: 'Dagger', rarity: 'common', shots: 1, effect: 'none', dmg: 10 * (1 + session.powerLevel * 0.08), range: 130, atkSpeed: 500 },
      trinket: null
    };
    this.playerFacing = 'front';
    this.playerSprite = this.add.image(this.player.x, this.player.y, `${CHARS.player}-front`).setDisplaySize(44, 44);
    // The ring stays a vector circle: it is the phase-colour tell, and must not inherit ship art.
    // Stance ring at Kiran's feet, not a circle around the body - a ring around a
    // character sprite reads as a bubble, but on the floor it reads as a stance and
    // leaves the silhouette clean. This is the Cosmic Cycle phase tell.
    this.playerRing = this.add.ellipse(this.player.x, this.player.y + 16, 34, 13, 0xffffff, 0)
      .setStrokeStyle(2, PHASE_DEFS.drift.color, 0.9);

    // HP bar
    const barX = 14, barY = 24, barW = W - 28, barH = 8;
    this.hpBarBg = this.add.rectangle(barX, barY, barW, barH, 0x2a2340).setOrigin(0,0.5).setStrokeStyle(1, 0x4a4460);
    this.hpBarFill = this.add.rectangle(barX, barY, barW, barH, 0x2fbf71).setOrigin(0,0.5);
    this.hpBarW = barW;

    // Phase bar - big, prominent, drains as the current phase runs out. This replaces the old tiny dial.
    const pbarX = 14, pbarY = 42, pbarW = W - 28, pbarH = 14;
    this.phaseBarBg = this.add.rectangle(pbarX, pbarY, pbarW, pbarH, 0x241d40).setOrigin(0,0.5).setStrokeStyle(1, 0x4a4460);
    this.phaseBarFill = this.add.rectangle(pbarX, pbarY, pbarW, pbarH, PHASE_DEFS.drift.color).setOrigin(0,0.5);
    this.phaseBarLabel = this.add.text(pbarX + pbarW/2, pbarY, 'DRIFT', { resolution: RES, fontSize: '11px', color: '#0d0a1a', fontStyle: 'bold' }).setOrigin(0.5);
    this.phaseBarW = pbarW;

    // Progress track - Dota-lane style: waves 1-5, gate at wave 3, ancient/flag at wave 5, moving marker
    const b = new Phaser.Geom.Rectangle(MARGIN, HUD_H + MARGIN, W - MARGIN*2, H - HUD_H - MARGIN*2);
    const trackY = b.y + 16;
    this.trackStartX = b.x + 34; this.trackEndX = b.right - 34;
    this.progressLine = this.add.rectangle((this.trackStartX+this.trackEndX)/2, trackY, this.trackEndX-this.trackStartX, 3, 0x3a2f66);
    this.progressNodes = [];
    for (let i = 1; i <= 5; i++) {
      const nx = this.trackStartX + (this.trackEndX-this.trackStartX) * (i-1)/4;
      let node;
      if (i === GATEKEEPER_WAVE) node = this.add.rectangle(nx, trackY, 13, 13, 0x241d40).setAngle(45).setStrokeStyle(2, 0xc77dff);
      else if (i === 5) node = this.add.circle(nx, trackY, 10, 0x241d40).setStrokeStyle(2, 0xffd23c);
      else node = this.add.circle(nx, trackY, 7, 0x241d40).setStrokeStyle(2, 0x4a4460);
      this.progressNodes.push(node);
    }
    this.progressMarker = this.add.triangle(this.trackStartX, trackY+16, 0,0, -6,9, 6,9, 0xffd23c);
    this.trackY = trackY;
    this.sectorLabel = this.add.text(this.trackStartX - 14, trackY, 'S1', { resolution: RES, fontSize: '10px', color: '#7a6fa0', fontStyle: 'bold' }).setOrigin(1, 0.5);

    this.atkTimer = 0;
    this.attackFx = this.add.graphics();
    this.buildSatchelUI();

    this.enemies = [];
    this.enemySprites = new Map();
    this.enemyCores = new Map();
    this.enemyRings = new Map();
    this.enemyShields = new Map();
    this.goldPickups = [];
    this.projectiles = [];
    this.pickups = [];

    this.runGold = 0;
    this.wave = 0;
    this.spawnQueue = [];
    this.spawnTimer = 0;

    this.showSectorBanner(this.sector);
    this.nextWave();
  }

  showSectorBanner(n) {
    const t1 = this.add.text(W/2, H/2-40, `SECTOR ${n}`, { resolution: RES, fontSize: '14px', color: '#7a6fa0', fontStyle: 'bold' }).setOrigin(0.5).setAlpha(0);
    const t2 = this.add.text(W/2, H/2-14, sectorTitle(n), { resolution: RES, fontSize: '20px', color: '#c77dff', fontStyle: 'bold' }).setOrigin(0.5).setAlpha(0);
    const t3 = this.add.text(W/2, H/2+16, sectorSub(n), { resolution: RES, fontSize: '12px', color: '#9a8fc2' }).setOrigin(0.5).setAlpha(0);
    [t1,t2,t3].forEach(t => {
      this.tweens.add({ targets: t, alpha: 1, duration: 300, hold: 1500, yoyo: true, onComplete: () => t.destroy() });
    });
  }

  updateProgressTrack() {
    const idx = Math.min(this.wave, 5) - 1;
    const nx = this.trackStartX + (this.trackEndX-this.trackStartX) * idx/4;
    this.tweens.add({ targets: this.progressMarker, x: nx, duration: 300, ease: 'Cubic.easeOut' });
    this.progressNodes.forEach((node, i) => {
      if (i < this.wave-1) node.fillColor = 0x2fbf71;
      else if (i === this.wave-1) node.fillColor = 0xffd23c;
    });
    if (this.sectorLabel) this.sectorLabel.setText('S' + this.sector);
  }

  nextWave() {
    this.wave++;
    this.depth = (this.sector-1)*5 + this.wave;
    this.updateProgressTrack();

    if (this.wave > 5) {
      this.spawnSectorBoss();
      const isMega = this.sector === MEGA_BOSS_SECTOR;
      this.showToast(isMega ? 'THE RIFT WARDEN AWAKENS' : 'THE HOARDBOUND STIRS', '#ffffff');
      return;
    }

    if (this.wave === GATEKEEPER_WAVE) {
      this.spawnGatekeeper();
      for (let i = 0; i < 2; i++) this.spawnQueue.push(i); // a little escort pressure alongside the boss
      this.spawnTimer = 700;
      this.showToast('THE GATEKEEPER AWAKENS', '#ffffff');
      return;
    }

    const count = 3 + this.wave;
    for (let i = 0; i < count; i++) this.spawnQueue.push(i);
    this.spawnTimer = 0;
  }

  descend() {
    this.clearUI();
    this.sector++;
    this.wave = 0;
    this.progressNodes.forEach(node => { node.fillColor = 0x241d40; });
    this.state = 'playing';
    this.showSectorBanner(this.sector);
    this.nextWave();
  }

  // Every enemy carries one now, not just tanks and bosses - you cannot read a
  // fight you cannot see the state of. Bars scale with the enemy so a swarm of
  // Asura reads as chatter and a boss bar reads as a wall.
  addHpBar(enemy) {
    const big = !!enemy.isBoss;
    const w = big ? Math.max(58, enemy.radius * 2.4) : Math.max(22, enemy.radius * 1.9);
    const h = big ? 6 : 3.5;
    const y = enemy.y - enemy.radius - (big ? 18 : 13);
    enemy.hpBarW = w;
    enemy.hpBarH = h;
    enemy.hpBarBg = this.add.rectangle(enemy.x, y, w, h, FORGE.deep, 0.8)
      .setStrokeStyle(1, 0x000000, 0.45);
    enemy.hpBarFill = this.add.rectangle(enemy.x - w/2, y, w, h, FORGE.gold).setOrigin(0, 0.5);
  }

  // ---------- SATCHEL (run inventory) ----------
  // Deliberately does NOT pause: 2.7 says pickups never interrupt play, and a
  // pause-to-swap would turn every drop into a menu trip. The panel is translucent
  // and hugs the right edge so the arena stays readable while it is open - swapping
  // mid-fight is meant to cost you something.
  buildSatchelUI() {
    const b = this.arenaBounds;
    const tabW = 26, tabH = 84;
    const tx = b.right - tabW / 2 - 2, ty = b.centerY;

    this.satchelTab = this.add.rectangle(tx, ty, tabW, tabH, FORGE.panel, 0.92)
      .setStrokeStyle(1, FORGE.bronze, 0.8)
      .setInteractive({ useHandCursor: true });
    this.satchelTabIcon = this.add.text(tx, ty - 12, '◀', { resolution: RES, fontSize: '11px', color: '#ffd23c' }).setOrigin(0.5);
    this.satchelTabCount = this.add.text(tx, ty + 8, '0', { resolution: RES, fontSize: '13px', color: '#fffbef', fontStyle: 'bold' }).setOrigin(0.5);
    this.satchelTab.on('pointerdown', () => this.toggleSatchel());

    this.satchelItems = [];
    this.satchelPanel = null;
  }

  toggleSatchel() {
    this.invOpen = !this.invOpen;
    this.satchelTabIcon.setText(this.invOpen ? '▶' : '◀');
    this.refreshSatchel();
  }

  clearSatchelPanel() {
    if (this.satchelPanel) { this.satchelPanel.destroy(); this.satchelPanel = null; }
    (this.satchelItems || []).forEach(o => o.destroy());
    this.satchelItems = [];
  }

  refreshSatchel() {
    if (!this.satchelTab) return;
    this.satchelTabCount.setText(String(this.inventory.length));
    this.clearSatchelPanel();
    if (!this.invOpen) return;

    const b = this.arenaBounds;
    // Height follows the actual contents, not INV_MAX - an empty satchel should not
    // black out a third of the arena you are still fighting in.
    const rows = Math.max(1, this.inventory.length);
    const pw = 150, ph = Math.min(b.height - 20, 30 + rows * 34 + 12);
    const px = b.right - pw / 2 - 28, py = b.centerY;

    this.satchelPanel = this.add.rectangle(px, py, pw, ph, FORGE.deep, 0.93)
      .setStrokeStyle(1, FORGE.bronze, 0.85);

    const top = py - ph / 2;
    this.satchelItems.push(this.add.text(px, top + 14, 'SATCHEL', { resolution: RES, fontSize: '10px', color: '#ffd23c', fontStyle: 'bold' }).setOrigin(0.5));

    if (this.inventory.length === 0) {
      this.satchelItems.push(this.add.text(px, top + 44, 'nothing swapped out yet', {
        resolution: RES, fontSize: '9px', color: '#8a7360', align: 'center', wordWrap: { width: pw - 20 }
      }).setOrigin(0.5));
      return;
    }

    this.inventory.forEach((item, i) => {
      const iy = top + 38 + i * 34;
      const row = this.add.rectangle(px, iy, pw - 14, 30, FORGE.panel, 0.9)
        .setStrokeStyle(1, FORGE.bronze, 0.4)
        .setInteractive({ useHandCursor: true });
      const icon = this.add.image(px - pw/2 + 20, iy, `icon_${item.effect || 'none'}`)
        .setDisplaySize(18, 18).setTint(RARITY[item.rarity].color);
      const name = this.add.text(px - pw/2 + 34, iy - 6, item.name, { resolution: RES, fontSize: '8px', color: '#fffbef' });
      const slot = this.add.text(px - pw/2 + 34, iy + 4, `${item.type} · tap to equip`, { resolution: RES, fontSize: '7px', color: '#8a7360' });
      row.on('pointerdown', () => this.equipFromSatchel(i));
      this.satchelItems.push(row, icon, name, slot);
    });
  }

  // Swap: the equipped item of the same slot goes back into the satchel, so nothing
  // is ever destroyed by a swap - only by the satchel overflowing.
  equipFromSatchel(index) {
    const item = this.inventory[index];
    if (!item) return;
    this.inventory.splice(index, 1);
    this.applyLoot(item, false);
    this.refreshSatchel();
  }

  stashItem(item) {
    if (!item || !this.inventory) return;
    this.inventory.push(item);
    // Oldest falls out rather than blocking pickups - losing the thing you stopped
    // using ages ago is a kinder failure than being unable to pick anything up.
    if (this.inventory.length > INV_MAX) this.inventory.shift();
    this.refreshSatchel();
  }

  destroySatchelUI() {
    this.clearSatchelPanel();
    [this.satchelTab, this.satchelTabIcon, this.satchelTabCount].forEach(o => o && o.destroy());
    this.satchelTab = this.satchelTabIcon = this.satchelTabCount = null;
  }

  addNameLabel(enemy) {
    const big = !!enemy.isBoss;
    const name = CHAR_LABELS[enemy.type] || '';
    if (!name) return;
    const label = enemy.isElite ? name.toUpperCase() : name;
    enemy.nameLabel = this.add.text(enemy.x, 0, label, {
      resolution: RES,
      fontSize: big ? '11px' : '8px',
      color: enemy.isElite ? '#ffd23c' : (big ? '#fffbef' : '#e3c9a8'),
      fontStyle: big ? 'bold' : 'normal'
    }).setOrigin(0.5).setAlpha(big ? 1 : 0.82);
  }

  // A second, separate bar above the HP bar showing how much shield is left. It sits
  // apart on purpose: while it has any fill the HP bar underneath is unreachable, and
  // two stacked bars say that far faster than a toast does.
  addShieldBar(enemy) {
    const w = Math.max(58, enemy.radius * 2.4);
    enemy.shieldBarW = w;
    enemy.shieldBarBg = this.add.rectangle(enemy.x, enemy.y - enemy.radius - 27, w, 5, FORGE.deep, 0.8)
      .setStrokeStyle(1, 0x000000, 0.45);
    enemy.shieldBarFill = this.add.rectangle(enemy.x - w/2, enemy.y - enemy.radius - 27, w, 5, 0x9fd8ff)
      .setOrigin(0, 0.5);
  }

  spawnGatekeeper() {
    const b = this.arenaBounds;
    const x = (b.x + b.right) / 2, y = b.y + 60;
    const weakPhase = Phaser.Utils.Array.GetRandom(PHASE_SEQUENCE);
    const hp = 220 + this.depth * 16;
    const enemy = {
      id: Phaser.Math.RND.uuid(),
      type: 'gatekeeper', isBoss: true, isSplit: false, isElite: false,
      x, y, hp, maxHp: hp,
      speed: 42, dmg: 0, radius: 26,
      hitCooldown: 0, goldDrop: 60 + this.depth * 4,
      isRanged: false,
      weakPhase,
      slamState: 'idle', slamTimer: 2200, slamRadius: 72
    };
    this.enemies.push(enemy);
    enemy.char = CHARS.gatekeeper;
    enemy.facing = 'front';
    const spr = this.add.image(x, y, `${enemy.char}-front`).setDisplaySize(enemy.radius * 2.8, enemy.radius * 2.8);
    // The weak-phase core sits UNDER the sprite as a glow pool, so Dwarapal's
    // silhouette stays readable while the colour tell is still unmistakable.
    const core = this.add.circle(x, y + enemy.radius * 0.55, 14, PHASE_DEFS[weakPhase].color, 0.85);
    core.setDepth(spr.depth - 1);
    this.tweens.add({ targets: core, alpha: 0.45, duration: 500, yoyo: true, repeat: -1 });
    this.enemySprites.set(enemy.id, spr);
    this.enemyCores.set(enemy.id, core);
    this.addHpBar(enemy);
    this.addNameLabel(enemy);
    return enemy;
  }

  spawnSectorBoss() {
    const isMega = this.sector === MEGA_BOSS_SECTOR;
    const b = this.arenaBounds;
    const x = (b.x + b.right) / 2, y = b.y + 70;
    const hp = 420 + this.depth * 26;
    const weakPhase = Phaser.Utils.Array.GetRandom(PHASE_SEQUENCE);
    const enemy = {
      id: Phaser.Math.RND.uuid(),
      type: 'sectorboss', isBoss: true, isSectorBoss: true, isMega: !!isMega,
      x, y, hp, maxHp: hp,
      speed: 34, dmg: 0, radius: isMega ? 38 : 32,
      hitCooldown: 0, goldDrop: isMega ? 260 : 130 + this.depth * 3,
      isRanged: false,
      weakPhase,
      bossPhase: isMega ? 'timing' : 'shielded',
      shieldOn: !isMega,
      keyAddIds: [],
      slamState: 'idle', slamTimer: 2000, slamRadius: 85
    };
    this.enemies.push(enemy);

    enemy.char = isMega ? CHARS.megaboss : CHARS.sectorboss;
    enemy.facing = 'front';
    const spr = this.add.image(x, y, `${enemy.char}-front`).setDisplaySize(enemy.radius * 2.8, enemy.radius * 2.8);
    this.enemySprites.set(enemy.id, spr);
    const outerRing = this.add.circle(x, y, enemy.radius + 10, 0x000000, 0).setStrokeStyle(2, isMega ? 0xc23cff : FORGE.gold, 0.5);
    this.enemyRings.set(enemy.id, outerRing);
    this.addHpBar(enemy);
    this.addNameLabel(enemy);

    if (isMega) {
      enemy.orbiters = [ this.add.circle(x, y, 4, 0xffd23c), this.add.circle(x, y, 4, 0xffd23c) ];
    }

    if (enemy.bossPhase === 'timing') {
      const core = this.add.circle(x, y + enemy.radius * 0.55, 16, PHASE_DEFS[weakPhase].color, 0.85);
      core.setDepth(spr.depth - 1);
      this.tweens.add({ targets: core, alpha: 0.45, duration: 500, yoyo: true, repeat: -1 });
      this.enemyCores.set(enemy.id, core);
    } else {
      this.spawnShieldAdds(enemy);
    }
    return enemy;
  }

  spawnShieldAdds(boss) {
    boss.keyAddIds = [];
    for (let i = 0; i < 3; i++) {
      const angle = (i / 3) * Math.PI * 2;
      const cx = Phaser.Math.Clamp(boss.x + Math.cos(angle) * 60, this.arenaBounds.x+16, this.arenaBounds.right-16);
      const cy = Phaser.Math.Clamp(boss.y + Math.sin(angle) * 60, this.arenaBounds.y+16, this.arenaBounds.bottom-16);
      const add = this.spawnEnemyOfType('melee', cx, cy, this.depth, false);
      add.isKeyAdd = true;
      add.ownerBossId = boss.id;
      boss.keyAddIds.push(add.id);
      const spr = this.enemySprites.get(add.id);
      // Character sprites are Images now, so the old gold outline is a gold wash -
      // same read ("this one is an anchor, kill it"), and it survives any art swap.
      if (spr) spr.setTint(0xffd23c);
    }
    // Shield: a breathing inner dome plus two counter-rotating rings. The old flat
    // circle gave no sense that it was holding anything back.
    const r = boss.radius + 8;
    const dome = this.add.circle(boss.x, boss.y, r, 0x9fd8ff, 0.16);
    const ringA = this.add.circle(boss.x, boss.y, r + 3, 0x000000, 0).setStrokeStyle(2, 0x9fd8ff, 0.75);
    const ringB = this.add.circle(boss.x, boss.y, r + 9, 0x000000, 0).setStrokeStyle(1.5, FORGE.cool, 0.45);

    this.tweens.add({ targets: dome, scale: 1.09, alpha: 0.28, duration: 780,
                      yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.tweens.add({ targets: ringA, angle: 360, duration: 6000, repeat: -1 });
    this.tweens.add({ targets: ringB, angle: -360, duration: 9000, repeat: -1 });

    boss.shieldParts = [dome, ringA, ringB];
    boss.shieldMax = boss.keyAddIds.length;
    this.enemyShields.set(boss.id, dome);   // kept for the existing pulse-on-hit path
    this.addShieldBar(boss);
    this.time.delayedCall(900, () => this.showToast('DESTROY THE ANCHORS', '#9fd8ff'));
  }

  transitionMegaBossToShield(boss) {
    if (this.enemyCores.has(boss.id)) { this.enemyCores.get(boss.id).destroy(); this.enemyCores.delete(boss.id); }
    boss.bossPhase = 'shielded';
    boss.shieldOn = true;
    this.showToast('THE WARDEN ANCHORS ITSELF', '#bfc4d6');
    this.spawnShieldAdds(boss);
  }

  spawnEnemy() {
    const type = pickEnemyType(this.depth);
    const edge = Phaser.Math.Between(0,3);
    const b = this.arenaBounds;
    let x,y;
    if (edge===0) { x = Phaser.Math.Between(b.x, b.right); y = b.y; }
    else if (edge===1) { x = Phaser.Math.Between(b.x, b.right); y = b.bottom; }
    else if (edge===2) { x = b.x; y = Phaser.Math.Between(b.y, b.bottom); }
    else { x = b.right; y = Phaser.Math.Between(b.y, b.bottom); }

    this.spawnEnemyOfType(type, x, y, this.depth, false);
  }

  spawnEnemyOfType(type, x, y, wave, isSplit, isElite) {
    const def = ENEMY_TYPES[type];
    const eliteMult = isElite ? 2.6 : 1;
    const hp = (16 + wave * 7) * def.hpMult * (isSplit ? 0.4 : 1) * eliteMult;
    const enemy = {
      id: Phaser.Math.RND.uuid(),
      type, isSplit: !!isSplit, isElite: !!isElite,
      x, y, hp, maxHp: hp,
      speed: (62 + wave * 5) * def.speedMult * (isSplit ? 1.15 : 1),
      dmg: (8 + wave * 1.4) * def.dmgMult * (isElite ? 1.5 : 1),
      radius: (isSplit ? Math.max(7, def.radius - 4) : def.radius) + (isElite ? 6 : 0),
      hitCooldown: 0,
      goldDrop: Math.ceil((4 + wave) * (isSplit ? 0.35 : 1) * (isElite ? 4 : 1)),
      isRanged: !!def.isRanged,
      preferredRange: def.preferredRange || 0,
      fireTimer: def.fireInterval ? Phaser.Math.Between(300, def.fireInterval) : 0,
      fireInterval: def.fireInterval || 0,
      projSpeed: def.projSpeed || 0,
      projDmg: def.projDmgMult ? (8 + wave * 1.4) * def.projDmgMult : 0,
      splitsOnDeath: !!def.splitsOnDeath && !isSplit
    };
    this.enemies.push(enemy);
    // Characters are now visually distinct by design (goblin / chieftain / brute / rogue),
    // so type no longer needs a tint to be readable - and tinting detailed art just
    // muddies it. Elites keep a gold wash because that IS a state, not an identity.
    enemy.char = CHARS[type];
    enemy.facing = 'front';
    const spr = this.add.image(x, y, `${enemy.char}-front`)
      .setDisplaySize(enemy.radius * 2.8, enemy.radius * 2.8);
    if (isElite) spr.setTint(0xffd23c);
    this.enemySprites.set(enemy.id, spr);
    this.addHpBar(enemy);
    this.addNameLabel(enemy);
    return enemy;
  }

  spawnElite() {
    const b = this.arenaBounds;
    const edge = Phaser.Math.Between(0,3);
    let x,y;
    if (edge===0) { x = Phaser.Math.Between(b.x, b.right); y = b.y; }
    else if (edge===1) { x = Phaser.Math.Between(b.x, b.right); y = b.bottom; }
    else if (edge===2) { x = b.x; y = Phaser.Math.Between(b.y, b.bottom); }
    else { x = b.right; y = Phaser.Math.Between(b.y, b.bottom); }
    this.spawnEnemyOfType('tank', x, y, this.depth, false, true);
  }

  // ---------- COMBAT ----------
  // Centralizes all damage TO the player so Aegis (shield block) applies consistently everywhere,
  // regardless of whether the source is contact, a boss slam, or a projectile.
  damagePlayer(amount) {
    if (this.player.shieldCharge > 0) {
      this.player.shieldCharge--;
      this.showToast('SHIELD BLOCKED', '#4dd0ff');
      return false;
    }
    this.player.hp -= amount;
    this.player.flashTimer = 150;
    if (this.player.hp <= 0) {
      this.player.hp = 0;
      this.endRun(false);
      return true;
    }
    return false;
  }

  killEnemy(enemy) {
    const spr = this.enemySprites.get(enemy.id);
    if (spr) spr.destroy();
    this.enemySprites.delete(enemy.id);
    if (this.enemyCores.has(enemy.id)) { this.enemyCores.get(enemy.id).destroy(); this.enemyCores.delete(enemy.id); }
    if (this.enemyRings.has(enemy.id)) { this.enemyRings.get(enemy.id).destroy(); this.enemyRings.delete(enemy.id); }
    if (this.enemyShields.has(enemy.id)) { this.enemyShields.get(enemy.id).destroy(); this.enemyShields.delete(enemy.id); }
    if (enemy.hpBarBg) { enemy.hpBarBg.destroy(); enemy.hpBarFill.destroy(); }
    if (enemy.shieldBarBg) { enemy.shieldBarBg.destroy(); enemy.shieldBarFill.destroy(); }
    if (enemy.shieldParts) enemy.shieldParts.forEach(pt => pt.destroy());
    if (enemy.nameLabel) enemy.nameLabel.destroy();
    if (enemy.orbiters) enemy.orbiters.forEach(o => o.destroy());
    if (enemy.telegraphGfx) { enemy.telegraphGfx.destroy(); enemy.telegraphGfx = null; }
    this.enemies.splice(this.enemies.indexOf(enemy), 1);

    this.runGold += enemy.goldDrop;

    // if this was a shield anchor, check whether its boss's shield should now break
    if (enemy.isKeyAdd && enemy.ownerBossId) {
      const boss = this.enemies.find(e => e.id === enemy.ownerBossId);
      if (boss) {
        boss.keyAddIds = boss.keyAddIds.filter(id => id !== enemy.id);
        if (boss.keyAddIds.length === 0 && boss.shieldOn) {
          boss.shieldOn = false;
          boss.bossPhase = 'active';
          // Blow the shield outward rather than snapping it off - the break is the
          // payoff for the anchor puzzle and deserves to be seen.
          (boss.shieldParts || []).forEach(part => {
            this.tweens.killTweensOf(part);
            this.tweens.add({ targets: part, scale: 1.7, alpha: 0, duration: 260,
                              ease: 'Cubic.easeOut', onComplete: () => part.destroy() });
          });
          boss.shieldParts = null;
          this.enemyShields.delete(boss.id);
          if (boss.shieldBarBg) {
            boss.shieldBarBg.destroy(); boss.shieldBarFill.destroy();
            boss.shieldBarBg = null; boss.shieldBarFill = null;
          }
          this.showToast('THE SHIELD BREAKS', '#2fbf71');
        }
      }
    }

    if (enemy.splitsOnDeath) {
      for (let i = 0; i < 2; i++) {
        const ox = enemy.x + Phaser.Math.Between(-18, 18);
        const oy = enemy.y + Phaser.Math.Between(-18, 18);
        this.spawnEnemyOfType('melee', ox, oy, this.depth, true);
      }
    }

    // Sector/Mega Boss defeat: skip normal wave-clear flow entirely, trigger the Extract/Descend choice instead
    if (enemy.isSectorBoss) {
      this.spawnLootPickup(enemy.x, enemy.y, 'epic');
      this.spawnLootPickup(enemy.x + 24, enemy.y, 'epic');
      this.showToast(enemy.isMega ? 'THE RIFT WARDEN FALLS' : 'THE HOARDBOUND FALLS', '#2fbf71');
      this.time.delayedCall(1000, () => { if (this.state === 'playing') this.showSectorClearChoice(enemy.isMega); });
      return;
    }

    const waveJustCleared = this.enemies.length === 0 && this.spawnQueue.length === 0;

    if (enemy.isBoss) {
      this.spawnLootPickup(enemy.x, enemy.y, 'epic');
      this.showToast('THE GATE OPENS', '#2fbf71');
    } else if (enemy.isElite) {
      this.spawnLootPickup(enemy.x, enemy.y, 'epic');
    } else if (waveJustCleared || Phaser.Math.Between(0,100) < 18) {
      this.spawnLootPickup(enemy.x, enemy.y);
    }
    if (waveJustCleared) this.afterWaveClear();
  }

  spawnLootPickup(x, y, forceRarity = null) {
    const isWeapon = Phaser.Math.Between(0,1) === 0;
    const phaseBoost = (PHASE_DEFS[this.phase] && PHASE_DEFS[this.phase].lootBoost) || 0;
    // ~25% of non-forced drops are Unidentified - you don't know what you're getting until you grab it
    const isMystery = !forceRarity && Phaser.Math.Between(0,100) < 25;
    const rarity = forceRarity || rollRarity(phaseBoost + (isMystery ? 10 : 0));
    const r = RARITY[rarity];

    let item;
    if (isWeapon) {
      // higher rarity = chance at extra simultaneous shots (Contra-style spread), not just bigger numbers
      let shots = 1;
      if (rarity === 'rare') shots = Phaser.Math.Between(0,100) < 50 ? 2 : 1;
      if (rarity === 'epic') shots = Phaser.Math.Between(2,3);

      const effectKey = pickWeaponEffect(this.sector);
      const effLabel = WEAPON_EFFECTS[effectKey].label;
      const baseName = shots > 1 ? 'Spread Blade' : 'Blade';
      item = {
        type: 'weapon', rarity, shots, effect: effectKey,
        name: (effLabel ? `${r.label} ${effLabel} ${baseName}` : `${r.label} ${baseName}`),
        dmg: 10 * r.mult * (1 + session.powerLevel*0.08),
        range: 130 + (r.mult-1)*20,
        atkSpeed: Math.max(180, 500 - (r.mult-1)*90),
        lifestealPct: effectKey === 'vampiric' ? 0.10 * r.mult : 0,
        poisonDmg: effectKey === 'venom' ? 3 * r.mult : 0,
        chainPct: effectKey === 'chain' ? Math.min(0.8, 0.4 * r.mult) : 0,
        executeBonusMult: effectKey === 'executioner' ? (rarity === 'common' ? 1.5 : rarity === 'rare' ? 2 : 2.5) : 1
      };
    } else {
      const effectKey = pickTrinketEffect(this.sector);
      const effLabel = TRINKET_EFFECTS[effectKey].label;
      item = {
        type: 'trinket', rarity, effect: effectKey,
        name: `${r.label} ${effLabel}`,
        hpBonus: effectKey === 'vitality' ? 20 * r.mult : 0,
        rechargeMs: effectKey === 'aegis' ? Math.round(10000 / r.mult) : 0,
        reflectPct: effectKey === 'thorns' ? Math.min(0.6, 0.2 * r.mult) : 0,
        speedBonus: effectKey === 'swift' ? Math.round(25 * r.mult) : 0,
        regenPerSec: effectKey === 'regen' ? +(1.5 * r.mult).toFixed(2) : 0
      };
    }

    const px = Phaser.Math.Clamp(x, this.arenaBounds.x+16, this.arenaBounds.right-16);
    const py = Phaser.Math.Clamp(y, this.arenaBounds.y+16, this.arenaBounds.bottom-16);

    const dispColor = isMystery ? 0xbfc4d6 : r.color;
    // Icon tells you WHAT dropped, tint tells you how good it is. Unidentified drops
    // deliberately show the same blank sigil regardless of contents - that ambiguity
    // is the whole incentive to risk walking over one.
    const iconKey = isMystery ? 'mystery' : (item.effect || 'none');
    const sprite = this.add.image(px, py, `icon_${iconKey}`)
      .setDisplaySize(19, 19)
      .setTint(dispColor);
    this.tweens.add({ targets: sprite, y: py-6, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    if (isMystery) {
      this.tweens.add({ targets: sprite, alpha: 0.45, duration: 350, yoyo: true, repeat: -1 });
    }
    const label = this.add.text(px, py-20, isMystery ? '???' : item.name, { resolution: RES, fontSize: '9px', color: isMystery ? '#bfc4d6' : '#e8e0ff' }).setOrigin(0.5);

    this.pickups.push({ x: px, y: py, item, sprite, label, isMystery });
  }

  showToast(msg, color) {
    const t = this.add.text(W/2, HUD_H + 20, msg, { resolution: RES, fontSize: '14px', color, fontStyle: 'bold' }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({
      targets: t, alpha: 1, y: HUD_H + 8, duration: 200, yoyo: true, hold: 700,
      onComplete: () => t.destroy()
    });
  }

  applyLoot(item, isMystery) {
    const tag = isMystery ? 'Mystery Revealed: ' : '';
    if (item.type === 'weapon') {
      // The outgoing weapon goes to the satchel rather than being lost.
      if (this.player.weapon) this.stashItem(this.player.weapon);
      this.player.weapon = item;
      this.showToast(`${tag}Equipped: ${item.name}`, isMystery ? '#ffd23c' : '#4dd0ff');
    } else {
      const oldHpBonus = (this.player.trinket && this.player.trinket.hpBonus) || 0;
      if (this.player.trinket) this.stashItem(this.player.trinket);
      this.player.trinket = item;
      this.player.maxHp += (item.hpBonus - oldHpBonus);
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + (item.hpBonus - oldHpBonus));
      this.player.shieldCharge = 0;
      this.player.shieldRechargeTimer = item.effect === 'aegis' ? item.rechargeMs : 0;
      this.showToast(`${tag}Equipped: ${item.name}`, isMystery ? '#ffd23c' : '#2fbf71');
    }
  }

  afterWaveClear() {
    this.runGold += 15 + this.depth * 4;
    this.time.delayedCall(400, () => { if (this.state === 'playing') this.nextWave(); });
  }

  showSectorClearChoice(isMega) {
    this.state = 'sectorChoice';
    this.clearUI();
    this.uiObjects.push(this.add.rectangle(W/2, H/2, W-50, 300, 0x17122b, 0.97).setStrokeStyle(2, 0x2fbf71));
    this.uiObjects.push(this.add.text(W/2, H/2-115, isMega ? 'THE RIFT WARDEN FALLS' : 'SECTOR CLEARED', { resolution: RES, fontSize: '19px', color: '#2fbf71', fontStyle: 'bold' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-80, `Sector ${this.sector} complete`, { resolution: RES, fontSize: '13px', color: '#e8e0ff' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-55, `Gold banked so far: ${this.runGold}`, { resolution: RES, fontSize: '13px', color: '#ffd23c' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-15,
      'Extract now and keep it all safe,\nor descend for tougher fights\nand better loot.',
      { resolution: RES, fontSize: '12px', color: '#9a8fc2', align: 'center', lineSpacing: 4 }).setOrigin(0.5));

    this.makeButton(W/2, H/2+65, 230, 46, 'Extract — Bank & End Run', 0x3a2f66, () => this.endRun(true));
    this.makeButton(W/2, H/2+120, 230, 46, `Descend to Sector ${this.sector+1}`, 0x7c3fff, () => this.descend());
  }

  // ---------- END OF RUN ----------
  endRun(victory) {
    this.state = 'summary';
    session.metaGold += this.runGold;
    if (this.sector > (session.bestSector || 0)) session.bestSector = this.sector;
    saveSession();

    this.clearUI();
    this.uiObjects.push(this.add.rectangle(W/2, H/2, W-50, 280, 0x17122b, 0.97).setStrokeStyle(2, victory ? 0x2fbf71 : 0xff5c5c));
    this.uiObjects.push(this.add.text(W/2, H/2-100, victory ? 'EXTRACTED SAFELY' : 'YOU FELL', { resolution: RES, fontSize: '24px', color: victory ? '#2fbf71' : '#ff5c5c', fontStyle: 'bold' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-55, `Sector reached: ${this.sector}`, { resolution: RES, fontSize: '15px', color: '#e8e0ff' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2-25, `Gold earned: ${this.runGold}`, { resolution: RES, fontSize: '15px', color: '#ffd23c' }).setOrigin(0.5));
    this.uiObjects.push(this.add.text(W/2, H/2+5, `Hoard total: ${session.metaGold}`, { resolution: RES, fontSize: '13px', color: '#9a8fc2' }).setOrigin(0.5));

    this.makeButton(W/2, H/2+80, 200, 48, 'Continue to Hub', 0x7c3fff, () => {
      // clean up run visuals
      if (this.playerSprite) this.playerSprite.destroy();
      if (this.playerRing) this.playerRing.destroy();
      if (this.hpBarBg) this.hpBarBg.destroy();
      if (this.hpBarFill) this.hpBarFill.destroy();
      if (this.phaseTint) this.phaseTint.destroy();
      if (this.phaseBarBg) this.phaseBarBg.destroy();
      if (this.phaseBarFill) this.phaseBarFill.destroy();
      if (this.phaseBarLabel) this.phaseBarLabel.destroy();
      if (this.progressLine) this.progressLine.destroy();
      if (this.progressNodes) this.progressNodes.forEach(n => n.destroy());
      if (this.progressMarker) this.progressMarker.destroy();
      if (this.sectorLabel) this.sectorLabel.destroy();
      if (this.weaponText) this.weaponText.setText('');
      this.destroySatchelUI();
      this.enemySprites.forEach(s => s.destroy());
      if (this.enemyCores) this.enemyCores.forEach(c => c.destroy());
      if (this.enemyRings) this.enemyRings.forEach(r => r.destroy());
      if (this.enemyShields) this.enemyShields.forEach(s => s.destroy());
      if (this.enemies) this.enemies.forEach(e => {
        if (e.telegraphGfx) e.telegraphGfx.destroy();
        if (e.orbiters) e.orbiters.forEach(o => o.destroy());
        if (e.hpBarBg) { e.hpBarBg.destroy(); e.hpBarFill.destroy(); }
        if (e.shieldBarBg) { e.shieldBarBg.destroy(); e.shieldBarFill.destroy(); }
        if (e.shieldParts) e.shieldParts.forEach(pt => pt.destroy());
        if (e.nameLabel) e.nameLabel.destroy();
      });
      this.goldPickups.forEach(g => g.sprite && g.sprite.destroy());
      if (this.projectiles) this.projectiles.forEach(p => { if (p.sprite) p.sprite.destroy(); if (p.halo) p.halo.destroy(); });
      if (this.pickups) this.pickups.forEach(pk => { pk.sprite.destroy(); pk.label.destroy(); });
      this.showHub();
    });
  }

  // ---------- MAIN LOOP ----------
  update(time, delta) {
    if (this.state !== 'playing') return;
    const dt = delta / 1000;

    // --- Cosmic Cycle: advance phase timer, trigger Convergence on schedule ---
    if (!this.inConvergence) {
      this.convergenceCountdown -= delta;
      this.phaseTimeLeft -= delta;
      if (this.convergenceCountdown <= 0) {
        this.savedPhase = this.phase;
        this.savedPhaseTimeLeft = this.phaseTimeLeft;
        this.inConvergence = true;
        this.phase = 'convergence';
        this.phaseTimeLeft = PHASE_DEFS.convergence.duration;
        this.convergenceCountdown = CONVERGENCE_INTERVAL;
        this.showToast('CONVERGENCE — an elite approaches', '#ffffff');
        this.spawnElite();
      } else if (this.phaseTimeLeft <= 0) {
        const idx = (PHASE_SEQUENCE.indexOf(this.phase) + 1) % PHASE_SEQUENCE.length;
        this.phase = PHASE_SEQUENCE[idx];
        this.phaseTimeLeft = PHASE_DEFS[this.phase].duration;
        this.showToast(`${PHASE_DEFS[this.phase].label} begins`, '#' + PHASE_DEFS[this.phase].color.toString(16).padStart(6,'0'));
      }
    } else {
      this.phaseTimeLeft -= delta;
      if (this.phaseTimeLeft <= 0) {
        this.inConvergence = false;
        this.phase = this.savedPhase;
        this.phaseTimeLeft = this.savedPhaseTimeLeft > 0 ? this.savedPhaseTimeLeft : PHASE_DEFS[this.phase].duration;
        this.showToast(`${PHASE_DEFS[this.phase].label} resumes`, '#' + PHASE_DEFS[this.phase].color.toString(16).padStart(6,'0'));
      }
    }

    // phase visuals - big countdown bar that drains as the phase runs out, flashes as a warning near the end
    const pdef = PHASE_DEFS[this.phase];
    this.phaseTint.fillColor = pdef.tint;
    this.phaseTint.fillAlpha = pdef.tintAlpha;
    const barFrac = Phaser.Math.Clamp(this.phaseTimeLeft / pdef.duration, 0, 1);
    this.phaseBarFill.width = this.phaseBarW * barFrac;
    this.phaseBarFill.fillColor = pdef.color;
    this.phaseBarLabel.setText(pdef.label);
    if (!this.inConvergence && this.phaseTimeLeft < 2500) {
      this.phaseBarFill.setAlpha(Math.sin(time/60) > 0 ? 1 : 0.3);
      this.phaseBarLabel.setAlpha(Math.sin(time/60) > 0 ? 1 : 0.3);
    } else {
      this.phaseBarFill.setAlpha(1);
      this.phaseBarLabel.setAlpha(1);
    }

    // --- movement ---
    // Captured before any movement so facing can be derived from where we actually went.
    const prevX = this.player.x, prevY = this.player.y;
    const swiftBonus = (this.player.trinket && this.player.trinket.effect === 'swift') ? this.player.trinket.speedBonus : 0;
    const moveSpeed = this.player.speed + swiftBonus;
    if (this.pointerTarget) {
      // tight follow: snaps toward touch point fast, no drifty acceleration. Swift trinket makes this snappier too.
      const lerpFactor = Math.min(0.9, 0.45 * (moveSpeed / this.player.speed));
      this.player.x = Phaser.Math.Linear(this.player.x, this.pointerTarget.x, lerpFactor);
      this.player.y = Phaser.Math.Linear(this.player.y, this.pointerTarget.y, lerpFactor);
    } else {
      let dx = 0, dy = 0;
      if (this.cursors.left.isDown || this.wasd.A.isDown) dx -= 1;
      if (this.cursors.right.isDown || this.wasd.D.isDown) dx += 1;
      if (this.cursors.up.isDown || this.wasd.W.isDown) dy -= 1;
      if (this.cursors.down.isDown || this.wasd.S.isDown) dy += 1;
      const len = Math.hypot(dx,dy);
      if (len > 0) { dx /= len; dy /= len; }
      this.player.x += dx * moveSpeed * dt;
      this.player.y += dy * moveSpeed * dt;
    }
    this.player.x = Phaser.Math.Clamp(this.player.x, this.arenaBounds.x+15, this.arenaBounds.right-15);
    this.player.y = Phaser.Math.Clamp(this.player.y, this.arenaBounds.y+15, this.arenaBounds.bottom-15);

    // block walking through enemies - push the player back out of any overlap
    for (const enemy of this.enemies) {
      const edx2 = this.player.x - enemy.x, edy2 = this.player.y - enemy.y;
      const edist2 = Math.hypot(edx2, edy2);
      const minDist = 15 + enemy.radius;
      if (edist2 < minDist) {
        if (edist2 > 0.01) {
          this.player.x += (edx2/edist2) * (minDist - edist2);
          this.player.y += (edy2/edist2) * (minDist - edist2);
        } else {
          this.player.x += minDist;
        }
      }
    }
    this.player.x = Phaser.Math.Clamp(this.player.x, this.arenaBounds.x+15, this.arenaBounds.right-15);
    this.player.y = Phaser.Math.Clamp(this.player.y, this.arenaBounds.y+15, this.arenaBounds.bottom-15);

    this.playerSprite.setPosition(this.player.x, this.player.y);
    this.playerRing.setPosition(this.player.x, this.player.y + 16);
    // Ring carries the live phase colour, so the player reads Cycle timing off their own feet.
    this.playerRing.setStrokeStyle(2, PHASE_DEFS[this.phase].color, 0.9);

    // Facing follows actual movement while moving, and falls back to the nearest
    // enemy when standing still - so a stationary player still looks engaged.
    const mdx = this.player.x - prevX, mdy = this.player.y - prevY;
    let want;
    if (Math.abs(mdx) > 0.05 || Math.abs(mdy) > 0.05) {
      want = facingFor(mdx, mdy);
    } else {
      let aim = null, aimD = Infinity;
      for (const e of this.enemies) {
        const d = Phaser.Math.Distance.Squared(this.player.x, this.player.y, e.x, e.y);
        if (d < aimD) { aimD = d; aim = e; }
      }
      want = aim ? facingFor(aim.x - this.player.x, aim.y - this.player.y) : this.playerFacing;
    }
    if (want && want !== this.playerFacing) {
      this.playerFacing = want;
      this.playerSprite.setTexture(`${CHARS.player}-${want}`);
    }

    // Slow drift sells "descending" without moving the arena itself.
    if (this.starfield) this.starfield.tilePositionY -= 0.28 * (delta / 16.67);

    if (this.player.flashTimer > 0) {
      this.player.flashTimer -= delta;
      this.playerSprite.setAlpha(Math.sin(time/40) > 0 ? 1 : 0.4);
    } else {
      this.playerSprite.setAlpha(1);
    }

    // --- spawn queue ---
    if (this.spawnQueue.length > 0) {
      this.spawnTimer -= delta;
      if (this.spawnTimer <= 0) {
        this.spawnQueue.pop();
        this.spawnEnemy();
        this.spawnTimer = 380 * PHASE_DEFS[this.phase].spawnRateMult;
      }
    }

    // --- enemies move + attack (behavior varies by type) ---
    for (const enemy of [...this.enemies]) {
      const edx = this.player.x - enemy.x, edy = this.player.y - enemy.y;
      const edist = Math.hypot(edx, edy) || 1;

      if (enemy.isRanged) {
        // kite: close in if too far, back off if too close, hold and fire at preferred range
        const diff = edist - enemy.preferredRange;
        if (Math.abs(diff) > 12) {
          const dir = diff > 0 ? 1 : -1;
          enemy.x += (edx/edist) * dir * enemy.speed * dt;
          enemy.y += (edy/edist) * dir * enemy.speed * dt;
        }
        enemy.fireTimer -= delta;
        if (enemy.fireTimer <= 0 && edist <= enemy.preferredRange + 60) {
          enemy.fireTimer = enemy.fireInterval;
          const pdx = edx/edist, pdy = edy/edist;
          // Yaksha's bolt: an elongated shard pointed along its travel, with a soft
          // halo behind it. A plain dot was hard to pick out against the forge floor.
          const halo = this.add.circle(enemy.x, enemy.y, 8, FORGE.flame, 0.25);
          const shard = this.add.ellipse(enemy.x, enemy.y, 14, 5, FORGE.gold)
            .setRotation(Math.atan2(pdy, pdx));
          const proj = {
            x: enemy.x, y: enemy.y,
            vx: pdx * enemy.projSpeed, vy: pdy * enemy.projSpeed,
            dmg: enemy.projDmg,
            sprite: shard, halo
          };
          this.projectiles.push(proj);
        }
      } else if (enemy.isBoss) {
        // Boss AI: while shielded, stands still (puzzle beat); once active, chases and telegraphs an AoE slam
        if (enemy.shieldOn) {
          const shieldGfx = this.enemyShields.get(enemy.id);
          if (shieldGfx) shieldGfx.setPosition(enemy.x, enemy.y);
        } else {
          enemy.x += (edx/edist) * enemy.speed * dt;
          enemy.y += (edy/edist) * enemy.speed * dt;

          enemy.slamTimer -= delta;
          if (enemy.slamState === 'idle' && enemy.slamTimer <= 0) {
            enemy.slamState = 'telegraph';
            enemy.slamTimer = 700;
            enemy.telegraphGfx = this.add.circle(enemy.x, enemy.y, enemy.slamRadius, 0xff5c5c, 0.18).setStrokeStyle(2, 0xff5c5c, 0.75);
          } else if (enemy.slamState === 'telegraph') {
            if (enemy.telegraphGfx) enemy.telegraphGfx.setPosition(enemy.x, enemy.y);
            if (enemy.slamTimer <= 0) {
              const slamDist = Math.hypot(this.player.x-enemy.x, this.player.y-enemy.y);
              if (slamDist <= enemy.slamRadius) {
                if (this.damagePlayer((enemy.isSectorBoss ? 28 : 22) * PHASE_DEFS[this.phase].enemyDmgMult)) return;
              }
              if (enemy.telegraphGfx) { enemy.telegraphGfx.destroy(); enemy.telegraphGfx = null; }
              enemy.slamState = 'idle';
              enemy.slamTimer = 2200;
            }
          }
        }
        const core = this.enemyCores.get(enemy.id);
        if (core) core.setPosition(enemy.x, enemy.y);
        const ring = this.enemyRings.get(enemy.id);
        if (ring) ring.setPosition(enemy.x, enemy.y);
        if (enemy.orbiters) {
          enemy.orbiters.forEach((o, idx) => {
            const ang = (time/500) + idx*Math.PI;
            o.setPosition(enemy.x + Math.cos(ang)*(enemy.radius+16), enemy.y + Math.sin(ang)*(enemy.radius+16));
          });
        }
      } else {
        // melee / tank / splitter: chase and hit on contact
        enemy.x += (edx/edist) * enemy.speed * dt;
        enemy.y += (edy/edist) * enemy.speed * dt;
        if (edist < (15 + enemy.radius) && enemy.hitCooldown <= 0) {
          enemy.hitCooldown = 420;
          if (this.damagePlayer(enemy.dmg * PHASE_DEFS[this.phase].enemyDmgMult)) return;
          if (this.player.trinket && this.player.trinket.effect === 'thorns') {
            enemy.hp -= enemy.dmg * this.player.trinket.reflectPct;
            if (enemy.hp <= 0) { this.killEnemy(enemy); continue; }
          }
        }
      }
      enemy.hitCooldown -= delta;

      // venom poison ticks - applies regardless of enemy type
      if (enemy.poison && enemy.poison.ticksLeft > 0) {
        enemy.poison.tickTimer -= delta;
        if (enemy.poison.tickTimer <= 0) {
          enemy.hp -= enemy.poison.dmgPerTick;
          enemy.poison.ticksLeft--;
          enemy.poison.tickTimer = 500;
          if (enemy.hp <= 0) { this.killEnemy(enemy); continue; }
        }
      }

      const spr = this.enemySprites.get(enemy.id);
      if (spr) {
        spr.setPosition(enemy.x, enemy.y);
        // 4-direction art must never be rotated - swap the facing frame instead.
        // Face the player, which is also the direction almost every enemy is moving.
        if (enemy.char) {
          const f = facingFor(this.player.x - enemy.x, this.player.y - enemy.y);
          if (f !== enemy.facing) {
            enemy.facing = f;
            spr.setTexture(`${enemy.char}-${f}`);
          }
        }
      }

      if (enemy.nameLabel) {
        // Sits above the topmost bar, so a shielded boss does not overlap its own name.
        const topBar = enemy.shieldBarFill ? 27 : (enemy.isBoss ? 18 : 13);
        // Clamped below the progress track: bosses spawn near the top of the arena and
        // their label would otherwise sit on top of the sector rail.
        const floor = (this.trackY || this.arenaBounds.y) + 14;
        enemy.nameLabel.setPosition(enemy.x, Math.max(floor, enemy.y - enemy.radius - topBar - 8));
      }
      if (enemy.shieldBarFill) {
        const sy = enemy.y - enemy.radius - 27;
        const left = (enemy.keyAddIds ? enemy.keyAddIds.length : 0) / (enemy.shieldMax || 1);
        enemy.shieldBarBg.setPosition(enemy.x, sy);
        enemy.shieldBarFill.x = enemy.x - enemy.shieldBarW/2;
        enemy.shieldBarFill.y = sy;
        enemy.shieldBarFill.width = enemy.shieldBarW * Math.max(0, left);
      }
      if (enemy.shieldParts) enemy.shieldParts.forEach(pt => pt.setPosition(enemy.x, enemy.y));
      if (enemy.hpBarBg) {
        const by = enemy.y - enemy.radius - (enemy.isBoss ? 18 : 13);
        const pct = Math.max(0, enemy.hp / enemy.maxHp);
        enemy.hpBarBg.setPosition(enemy.x, by);
        enemy.hpBarFill.x = enemy.x - enemy.hpBarW/2;
        enemy.hpBarFill.y = by;
        enemy.hpBarFill.width = enemy.hpBarW * pct;
        // Gold -> ember -> crimson as it drains: reads at a glance without a number,
        // and stays inside the forge palette instead of the old generic green/red.
        enemy.hpBarFill.fillColor = pct > 0.5 ? FORGE.gold : (pct > 0.22 ? FORGE.flame : 0xc4331f);
      }
    }

    // --- projectiles ---
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.sprite.setPosition(p.x, p.y);
      if (p.halo) p.halo.setPosition(p.x, p.y);

      const pdist = Math.hypot(p.x - this.player.x, p.y - this.player.y);
      const offscreen = p.x < 0 || p.x > W || p.y < 0 || p.y > H;

      if (pdist < 18) {
        const died = this.damagePlayer(p.dmg * PHASE_DEFS[this.phase].enemyDmgMult);
        this.impactBurst(p.x, p.y, FORGE.flame);
        p.sprite.destroy(); if (p.halo) p.halo.destroy();
        this.projectiles.splice(i,1);
        if (died) return;
      } else if (offscreen) {
        p.sprite.destroy(); if (p.halo) p.halo.destroy();
        this.projectiles.splice(i,1);
      }
    }

    // --- auto attack (fires at up to `shots` nearest enemies in range - spread weapons hit multiple) ---
    this.atkTimer -= delta;
    if (this.atkTimer <= 0 && this.enemies.length > 0) {
      const inRange = this.enemies
        .map(e => ({ e, d: Math.hypot(e.x-this.player.x, e.y-this.player.y) }))
        .filter(o => o.d <= this.player.weapon.range)
        .sort((a,b) => a.d - b.d)
        .slice(0, this.player.weapon.shots || 1);

      if (inRange.length) {
        this.atkTimer = this.player.weapon.atkSpeed;
        this.attackFx.clear();
        const wfx = this.player.weapon.effect;
        const beamColour = { venom: 0x7fdd3c, vampiric: 0xff8080, chain: 0x4dd0ff,
                             executioner: FORGE.gold }[wfx] || FORGE.cool;
        inRange.forEach(({e}) => {
          this.drawWeaponBeam(this.player.x, this.player.y, e.x, e.y, wfx);
          if (e.shieldOn) {
            // Shielded bosses take no damage until their anchors die - show the beam
            // stopping dead on the shield so that reads as "blocked", not "missed".
            this.impactBurst(e.x, e.y, 0xbfc4d6);
            return;
          }
          this.impactBurst(e.x, e.y, beamColour);
          let dmg = this.player.weapon.dmg * PHASE_DEFS[this.phase].playerDmgMult;
          if (e.isBoss && (!e.isSectorBoss || e.bossPhase === 'timing')) {
            dmg *= (this.phase === e.weakPhase) ? 1 : 0.12;
          }
          if (this.player.weapon.effect === 'executioner' && e.hp/e.maxHp <= 0.25) {
            dmg *= this.player.weapon.executeBonusMult;
          }
          e.hp -= dmg;
          if (this.player.weapon.effect === 'vampiric') {
            this.player.hp = Math.min(this.player.maxHp, this.player.hp + dmg * this.player.weapon.lifestealPct);
          }
          if (this.player.weapon.effect === 'venom') {
            e.poison = { dmgPerTick: this.player.weapon.poisonDmg, ticksLeft: 4, tickTimer: 500 };
          }
        });
        // Chain: after primary hits land, jump to one nearby enemy not already hit
        if (this.player.weapon.effect === 'chain') {
          const primaryIds = new Set(inRange.map(o => o.e.id));
          inRange.forEach(({e: primary}) => {
            let secondary = null, sd = 90;
            for (const cand of this.enemies) {
              if (primaryIds.has(cand.id) || cand.shieldOn) continue;
              const d = Math.hypot(cand.x-primary.x, cand.y-primary.y);
              if (d <= sd) { secondary = cand; sd = d; }
            }
            if (secondary) {
              this.drawWeaponBeam(primary.x, primary.y, secondary.x, secondary.y, 'chain');
              this.impactBurst(secondary.x, secondary.y, 0x4dd0ff);
              secondary.hp -= this.player.weapon.dmg * PHASE_DEFS[this.phase].playerDmgMult * this.player.weapon.chainPct;
              if (secondary.hp <= 0) this.killEnemy(secondary);
            }
          });
        }
        this.time.delayedCall(80, () => this.attackFx.clear());
        inRange.forEach(({e}) => { if (e.hp <= 0) this.killEnemy(e); });
        inRange.forEach(({e}) => {
          if (e.isMega && e.bossPhase === 'timing' && e.hp > 0 && e.hp <= e.maxHp * 0.55) {
            this.transitionMegaBossToShield(e);
          }
        });
      } else {
        this.atkTimer = 100;
      }
    }

    // --- loot pickups (walk over to equip, no pause) ---
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const pk = this.pickups[i];
      if (Math.hypot(pk.x - this.player.x, pk.y - this.player.y) < 26) {
        this.applyLoot(pk.item, pk.isMystery);
        pk.sprite.destroy();
        pk.label.destroy();
        this.pickups.splice(i,1);
      }
    }

    // --- passive trinket effects: Aegis recharge, Regen healing ---
    if (this.player.trinket) {
      if (this.player.trinket.effect === 'aegis') {
        this.player.shieldRechargeTimer -= delta;
        if (this.player.shieldRechargeTimer <= 0 && this.player.shieldCharge < 1) {
          this.player.shieldCharge = 1;
          this.player.shieldRechargeTimer = this.player.trinket.rechargeMs;
          this.showToast('SHIELD READY', '#4dd0ff');
        }
      } else if (this.player.trinket.effect === 'regen') {
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.trinket.regenPerSec * dt);
      }
    }

    // --- HP bar update ---
    const hpPct = Math.max(0, this.player.hp/this.player.maxHp);
    this.hpBarFill.width = this.hpBarW * hpPct;
    this.hpBarFill.fillColor = hpPct > 0.5 ? 0x2fbf71 : (hpPct > 0.25 ? 0xffd23c : 0xff5c5c);

    // --- HUD text ---
    this.hudText.setText(`Sector ${this.sector} · Wave ${Math.min(this.wave,5)}/5   Gold: ${this.runGold}`);
    this.weaponText.setText(`${this.player.weapon.name}${this.player.weapon.shots>1 ? ' x'+this.player.weapon.shots : ''}   ${Math.ceil(this.player.hp)}/${Math.ceil(this.player.maxHp)} HP`);
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  backgroundColor: '#2a0800',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: W * RES,
    height: H * RES
  },
  scene: LootScene
};

// Kept on window so the running game can be inspected or driven from the console
// (e.g. game.scene.keys.LootScene) - useful for debugging and automated smoke tests.
window.game = new Phaser.Game(config);
</script>
</body>
